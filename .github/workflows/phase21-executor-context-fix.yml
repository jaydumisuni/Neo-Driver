name: Phase 21 rollback context correction

on:
  push:
    branches:
      - implementation/phase21-repair-windows-features
    paths:
      - .github/workflows/phase21-executor-context-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 21 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase21-repair-windows-features
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply rollback-context correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/neo-repair/src/executor.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one executor replacement, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''            if self.stage() == TransactionStage::RollingBack {
                          self.rollback_feature_with_host(host)?;
                          return Err(RepairError::CommandFailed(
                              "Windows feature postcondition failed and the captured baseline was restored"
                                  .to_string(),
                          ));
                      }
          ''',
          '''            if self.stage() == TransactionStage::RollingBack {
                          let rollback = self.rollback_feature_with_host(host);
                          return Err(rollback_context_error(
                              rollback,
                              "Windows feature postcondition failed and the captured baseline was restored",
                              "Windows feature postcondition failed",
                          ));
                      }
          ''')

          replace_once(
          '''                if self.stage() == TransactionStage::RollingBack {
                              self.rollback_feature_with_host(host)?;
                              return Err(RepairError::CommandFailed(
                                  "post-reboot feature verification failed and rollback was required"
                                      .to_string(),
                              ));
                          }
          ''',
          '''                if self.stage() == TransactionStage::RollingBack {
                              let rollback = self.rollback_feature_with_host(host);
                              return Err(rollback_context_error(
                                  rollback,
                                  "post-reboot feature verification failed and rollback was required",
                                  "post-reboot feature verification failed",
                              ));
                          }
          ''')

          replace_once(
          '''                if self.stage() == TransactionStage::RollingBack {
                              self.rollback_feature_with_host(host)?;
                              return Err(RepairError::CommandFailed(
                                  "blocked feature verification remained unproven and rollback was required"
                                      .to_string(),
                              ));
                          }
          ''',
          '''                if self.stage() == TransactionStage::RollingBack {
                              let rollback = self.rollback_feature_with_host(host);
                              return Err(rollback_context_error(
                                  rollback,
                                  "blocked feature verification remained unproven and rollback was required",
                                  "blocked feature verification remained unproven",
                              ));
                          }
          ''')

          replace_once(
          '''        if self.stage() == TransactionStage::RollingBack {
                      self.rollback_feature_with_host(host)?;
                  }
                  Err(RepairError::CommandFailed(
                      "interrupted Phase 21 apply could not be proven successful from fresh state"
                          .to_string(),
                  ))
          ''',
          '''        if self.stage() == TransactionStage::RollingBack {
                      let rollback = self.rollback_feature_with_host(host);
                      return Err(rollback_context_error(
                          rollback,
                          "interrupted Phase 21 apply could not be proven successful from fresh state",
                          "interrupted Phase 21 apply could not be proven successful from fresh state",
                      ));
                  }
                  Err(RepairError::CommandFailed(
                      "interrupted Phase 21 apply could not be proven successful from fresh state"
                          .to_string(),
                  ))
          ''')

          anchor = '''fn command_detail(evidence: &crate::model::BoundedCommandEvidence) -> String {
          '''
          helper = '''fn rollback_context_error(
              rollback: Result<(), RepairError>,
              restored_detail: &str,
              failure_detail: &str,
          ) -> RepairError {
              match rollback {
                  Ok(()) => RepairError::CommandFailed(restored_detail.to_string()),
                  Err(error) => RepairError::CommandFailed(format!(
                      "{failure_detail}; rollback also failed: {error}"
                  )),
              }
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('executor helper anchor changed')
          text = text.replace(anchor, helper + anchor, 1)

          test_anchor = '''    #[test]
              fn rollback_command_start_failure_is_recorded_and_terminal() {
          '''
          test = '''    #[test]
              fn rollback_context_keeps_primary_and_secondary_failure_truth() {
                  let error = rollback_context_error(
                      Err(RepairError::CommandFailed("secondary rollback failure".to_string())),
                      "baseline restored",
                      "primary verification failure",
                  );
                  let detail = error.to_string();
                  assert!(detail.contains("primary verification failure"));
                  assert!(detail.contains("secondary rollback failure"));
                  assert!(!detail.contains("baseline restored"));
              }

          '''
          if text.count(test_anchor) != 1:
              raise SystemExit('executor test anchor changed')
          text = text.replace(test_anchor, test + test_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove correction
        run: |
          cargo fmt --all
          python -W error tools/phase21_static_review.py
          cargo test --locked -p neo-repair
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          git diff --check

      - name: Publish corrected source
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add crates/neo-repair/src/executor.rs
          git commit -m "fix: preserve Phase 21 rollback failure context"
          git push origin HEAD:implementation/phase21-repair-windows-features
