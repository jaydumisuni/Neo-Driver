name: Phase 14 one-shot refresh

on:
  push:
    branches: ["implementation/phase-14-debloat-live-probe"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-14-debloat-live-probe
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
      - name: Generate exact lock and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
          rm .github/workflows/phase14_refresh.yml
          git diff --check
      - name: Commit refreshed repository state
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add Cargo.lock crates/neo-debloat-probe .github/workflows/phase14_refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Phase 14: refresh lockfile and formatting"
          git push origin HEAD:implementation/phase-14-debloat-live-probe
