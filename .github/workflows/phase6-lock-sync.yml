name: Phase 6 Cargo Lock Sync

on:
  push:
    branches: ["implementation/phase-6-runtimes-gaming"]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-runtimes-gaming
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate canonical lockfile
        run: cargo generate-lockfile

      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/phase6-lock-sync.yml
          git commit -m "phase6: sync generated Cargo lock state"
          git push origin HEAD:implementation/phase-6-runtimes-gaming
