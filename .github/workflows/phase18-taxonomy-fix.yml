name: Phase 18 Taxonomy Fix Helper

on:
  push:
    branches: [implementation/phase18-debloat-restore-executor]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase18-debloat-restore-executor
          fetch-depth: 0
      - name: Apply exact error-taxonomy correction
        env:
          PATCH_B64: 
        run: python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Install and format Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
          cargo fmt --all
      - name: Commit permanent correction only
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/phase18-taxonomy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/neo-debloat-restore-executor/src/engine.rs crates/neo-debloat-restore-executor/src/tests.rs docs/decisions/0018-PHASE18-DEBLOAT-RESTORE-EXECUTOR.md
          git commit -m 'Phase 18: classify unproven no-change restore correctly'
          git push origin HEAD:implementation/phase18-debloat-restore-executor
