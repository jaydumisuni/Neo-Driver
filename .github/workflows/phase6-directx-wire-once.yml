name: Phase 6 DirectX Wire Once

on:
  push:
    branches: ["implementation/phase-6-runtimes-gaming"]
    paths:
      - "tools/phase6_wire_directx.py"
      - ".github/workflows/phase6-directx-wire-once.yml"

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-runtimes-gaming

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply bounded wiring
        run: python tools/phase6_wire_directx.py

      - name: Refresh exact lock graph
        run: cargo generate-lockfile

      - name: Format
        run: cargo fmt --all

      - name: Phase 1-6 static proof
        shell: pwsh
        run: |
          python tools/phase1_static_review.py
          python -W error tools/phase2_static_review.py
          python -W error tools/phase3_static_review.py
          python -W error tools/phase4_static_review.py
          python -W error tools/phase5_static_review.py
          python -W error tools/phase6_static_review.py

      - name: Compiler proof
        run: cargo check --workspace --all-targets --locked

      - name: Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit proof
        run: cargo test --workspace --all-targets --locked

      - name: Self-clean and commit proven correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/phase6_wire_directx.py .github/workflows/phase6-directx-wire-once.yml
          git add Cargo.toml Cargo.lock crates/neo-directx-legacy crates/neo-runtime-probe tools/phase6_static_review.py
          git diff --cached --check
          git commit -m "phase6: integrate proven DirectX legacy completeness"
          git push origin HEAD:implementation/phase-6-runtimes-gaming
