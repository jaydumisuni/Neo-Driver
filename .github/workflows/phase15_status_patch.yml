name: Phase 15 canonical status patch

on:
  push:
    branches: ["docs/phase15-final-status"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase15-final-status
      - name: Apply canonical Phase 15 status
        run: python tools/phase15_status_patch.py
      - name: Verify status patch
        run: |
          git diff --check
          test -n "$(git diff -- docs/IMPLEMENTATION_STATUS.md)"
      - name: Commit canonical status
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md
          git commit -m "Phase 15: record canonical implementation status"
          git push origin HEAD:docs/phase15-final-status
