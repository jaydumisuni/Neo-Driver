name: Phase 6 Windows Handle Close Once

on:
  push:
    branches: ["implementation/phase-6-managed-vault"]

permissions:
  contents: write

jobs:
  proof:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-winhandle-done]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-managed-vault
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply exact Windows handle-lifetime correction
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/neo-vault/src/store.rs")
          text = path.read_text(encoding="utf-8")

          old = '''        validate_staging_marker(&session_dir, session, &display)?;
          staging.remove_dir_all(session.as_str())?;'''
          new = '''        validate_staging_marker(&session_dir, session, &display)?;
          drop(session_dir);
          staging.remove_dir_all(session.as_str())?;'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''            if let Err(error) = final_file.sync_all() {
              drop(final_file);
              let _ = version_dir.remove_file(&destination_name);
              return Err(VaultError::Io(error));
          }
          drop(final_file);'''
          new = '''            drop(staged_reader);
          if let Err(error) = final_file.sync_all() {
              drop(final_file);
              let _ = version_dir.remove_file(&destination_name);
              return Err(VaultError::Io(error));
          }
          drop(final_file);'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        let cleanup_result = self.cleanup_staging(&session);'''
          new = '''        drop(session_dir);
          let cleanup_result = self.cleanup_staging(&session);'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Format and Phase 6 structural proof
        run: |
          cargo fmt --all
          python -W error tools/phase6_static_review.py
          cargo fmt --all -- --check

      - name: Windows compiler proof
        run: cargo check --workspace --all-targets --locked

      - name: Windows Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Windows vault regression proof
        run: cargo test --locked -p neo-vault --all-targets

      - name: Commit proven correction and self-clean
        shell: bash
        run: |
          rm .github/workflows/phase6-windows-handle-close-once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add crates/neo-vault/src/store.rs .github/workflows/phase6-windows-handle-close-once.yml
          git diff --cached --check
          git commit -m "Phase 6: close Windows vault handles before cleanup [phase6-winhandle-done]"
          git push origin HEAD:implementation/phase-6-managed-vault
