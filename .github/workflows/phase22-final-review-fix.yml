# trigger-existing-workflow
name: Phase 22 final review corrections

on:
  push:
    branches:
      - implementation/phase22-driver-pnp-assessment
    paths:
      - .github/workflows/phase22-final-review-fix.yml

permissions:
  contents: write

jobs:
  correct-and-prove:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: implementation/phase22-driver-pnp-assessment
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply exact review corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          model = root / 'crates/neo-driver-repair/src/model.rs'
          replace_once(
              model,
              'pub(crate) const CM_PROB_DISABLED_CODE: u32 = 22;\n',
              '''pub(crate) const CM_PROB_DISABLED_CODE: u32 = 22;\n\npub(crate) fn is_phase5_oem_published_inf(value: &str) -> bool {\n    let lower = value.to_ascii_lowercase();\n    if value.contains([\\'\\\\\\', \\'/\\']) || !lower.starts_with("oem") || !lower.ends_with(".inf") {\n        return false;\n    }\n    let digits = &lower[3..lower.len() - 4];\n    !digits.is_empty() && digits.chars().all(|character| character.is_ascii_digit())\n}\n''',
              'model predicate',
          )
          replace_once(
              model,
              '''            let Some(published) = published else {\n                return Err(DriverRepairError::PackageWithoutBinding(\n                    self.device.instance_id.to_string(),\n                ));\n            };\n            if !package.published_inf.eq_ignore_ascii_case(published) {''',
              '''            let Some(published) = published else {\n                return Err(DriverRepairError::PackageWithoutBinding(\n                    self.device.instance_id.to_string(),\n                ));\n            };\n            if !is_phase5_oem_published_inf(published)\n                || !is_phase5_oem_published_inf(&package.published_inf)\n            {\n                return Err(DriverRepairError::InvalidEvidence(format!(\n                    "device {} current package is not a Phase 5 OEM published INF identity",\n                    self.device.instance_id\n                )));\n            }\n            if !package.published_inf.eq_ignore_ascii_case(published) {''',
              'model imported package restriction',
          )

          assessment = root / 'crates/neo-driver-repair/src/assessment.rs'
          replace_once(
              assessment,
              'use crate::model::CM_PROB_DISABLED_CODE;\n',
              'use crate::model::{is_phase5_oem_published_inf, CM_PROB_DISABLED_CODE};\n',
              'assessment import',
          )
          old_helper = '''\n#[cfg(any(windows, test))]\nfn is_phase5_oem_published_inf(value: &str) -> bool {\n    let lower = value.to_ascii_lowercase();\n    if value.contains([\\'\\\\\\', \\'/\\']) || !lower.starts_with("oem") || !lower.ends_with(".inf") {\n        return false;\n    }\n    let digits = &lower[3..lower.len() - 4];\n    !digits.is_empty() && digits.chars().all(|character| character.is_ascii_digit())\n}\n'''
          replace_once(assessment, old_helper, '\n', 'assessment duplicate predicate')

          tests = root / 'crates/neo-driver-repair/src/tests.rs'
          replace_once(
              tests,
              '''#[test]\nfn mismatched_driver_store_identity_is_rejected() {\n    let error = assess_driver_repair_evidence(evidence(\n        device("PCI\\\\H", Some(28), Some("oem16.inf")),\n        Some(package("oem17.inf")),\n    ))\n    .unwrap_err();\n    assert!(matches!(error, DriverRepairError::PackageMismatch(_)));\n}\n''',
              '''#[test]\nfn mismatched_driver_store_identity_is_rejected() {\n    let error = assess_driver_repair_evidence(evidence(\n        device("PCI\\\\H", Some(28), Some("oem16.inf")),\n        Some(package("oem17.inf")),\n    ))\n    .unwrap_err();\n    assert!(matches!(error, DriverRepairError::PackageMismatch(_)));\n}\n\n#[test]\nfn imported_inbox_inf_cannot_claim_exact_package_authority() {\n    let error = assess_driver_repair_evidence(evidence(\n        device("ROOT\\\\INBOX", None, Some("machine.inf")),\n        Some(package("machine.inf")),\n    ))\n    .unwrap_err();\n    assert!(matches!(error, DriverRepairError::InvalidEvidence(_)));\n}\n''',
              'imported inbox regression',
          )

          windows = root / 'crates/neo-driverstore/src/windows.rs'
          replace_once(
              windows,
              '''    DI_FLAGSEX_ALLOWEXCLUDEDDRVS, HDEVINFO, SPDIT_COMPATDRIVER, SPDRP_CLASS, SPDRP_CLASSGUID,\n    SPDRP_COMPATIBLEIDS, SPDRP_DEVICEDESC, SPDRP_HARDWAREID, SPDRP_MFG, SPOST_PATH, SP_COPY_STYLE,\n    SP_DEVINFO_DATA, SP_DEVINSTALL_PARAMS_W, SP_DRVINFO_DATA_V2_W, SP_INF_SIGNER_INFO_V2_W,\n''',
              '''    DI_FLAGSEX_ALLOWEXCLUDEDDRVS, HDEVINFO, SPDIT_COMPATDRIVER, SPDRP_CLASS, SPDRP_CLASSGUID,\n    SPDRP_COMPATIBLEIDS, SPDRP_DEVICEDESC, SPDRP_HARDWAREID, SPDRP_LOWERFILTERS, SPDRP_MFG,\n    SPDRP_UPPERFILTERS, SPOST_PATH, SP_COPY_STYLE, SP_DEVINFO_DATA, SP_DEVINSTALL_PARAMS_W,\n    SP_DRVINFO_DATA_V2_W, SP_INF_SIGNER_INFO_V2_W,\n''',
              'filter imports',
          )
          replace_once(
              windows,
              '''            let problem_code = problem_code(&data)?;\n            devices.push(DeviceRecord {''',
              '''            let problem_code = problem_code(&data)?;\n            let upper_filters = registry_multisz(set.0, &data, SPDRP_UPPERFILTERS)?;\n            let lower_filters = registry_multisz(set.0, &data, SPDRP_LOWERFILTERS)?;\n            devices.push(DeviceRecord {''',
              'filter reads',
          )
          replace_once(
              windows,
              '''                upper_filters: vec![],\n                lower_filters: vec![],\n''',
              '''                upper_filters,\n                lower_filters,\n''',
              'filter assignments',
          )

          review = root / 'tools/phase22_static_review.py'
          replace_once(
              review,
              '''DRIVER_HOST = (ROOT / "crates" / "neo-driverstore" / "src" / "host.rs").read_text(\n    encoding="utf-8"\n)\n''',
              '''DRIVER_HOST = (ROOT / "crates" / "neo-driverstore" / "src" / "host.rs").read_text(\n    encoding="utf-8"\n)\nDRIVERSTORE_WINDOWS = (\n    ROOT / "crates" / "neo-driverstore" / "src" / "windows.rs"\n).read_text(encoding="utf-8")\n''',
              'static Windows source binding',
          )
          replace_once(
              review,
              '''    (\n        "08-package-identity-equality",\n        "eq_ignore_ascii_case(published)" in MODEL\n        and "DriverRepairError::PackageMismatch" in MODEL\n        and "mismatched_driver_store_identity_is_rejected" in TESTS,\n    ),\n''',
              '''    (\n        "08-package-identity-equality",\n        "is_phase5_oem_published_inf" in MODEL\n        and "eq_ignore_ascii_case(published)" in MODEL\n        and "DriverRepairError::PackageMismatch" in MODEL\n        and "mismatched_driver_store_identity_is_rejected" in TESTS\n        and "imported_inbox_inf_cannot_claim_exact_package_authority" in TESTS,\n    ),\n''',
              'static imported package law',
          )
          replace_once(
              review,
              '''    (\n        "14-filters-are-evidence-only",\n        has_all(MODEL, ("upper_filters", "lower_filters"))\n        and "filters_are_retained_as_evidence_not_inferred_as_fault" in TESTS,\n    ),\n''',
              '''    (\n        "14-filters-are-evidence-only",\n        has_all(MODEL, ("upper_filters", "lower_filters"))\n        and has_all(\n            DRIVERSTORE_WINDOWS,\n            (\n                "SPDRP_UPPERFILTERS",\n                "SPDRP_LOWERFILTERS",\n                "let upper_filters = registry_multisz",\n                "let lower_filters = registry_multisz",\n                "upper_filters,",\n                "lower_filters,",\n            ),\n        )\n        and "filters_are_retained_as_evidence_not_inferred_as_fault" in TESTS,\n    ),\n''',
              'static filter collection law',
          )
          '@ | python -
      - name: Format
        shell: pwsh
        run: cargo fmt --all
      - name: Phase 5 static review
        shell: pwsh
        run: python -W error tools/phase5_static_review.py
      - name: Phase 22 static review
        shell: pwsh
        run: python -W error tools/phase22_static_review.py
      - name: Focused Phase 5 proof
        shell: pwsh
        run: cargo test --locked -p neo-driverstore
      - name: Focused Phase 22 proof
        shell: pwsh
        run: cargo test --locked -p neo-driver-repair
      - name: Workspace Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit proven corrections
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driver-repair/src/model.rs crates/neo-driver-repair/src/assessment.rs crates/neo-driver-repair/src/tests.rs crates/neo-driverstore/src/windows.rs tools/phase22_static_review.py
          if (git diff --cached --quiet) { throw 'No Phase 22 review correction was produced.' }
          git commit -m "fix: close Phase 22 imported-package and filter evidence gaps"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
