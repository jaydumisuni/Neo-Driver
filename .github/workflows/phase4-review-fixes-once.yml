name: Phase 4 Review Fixes Once

on:
  push:
    branches: ["implementation/phase-4-transaction-v2"]

permissions:
  contents: write

jobs:
  review-fixes-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-review-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-4-transaction-v2
          fetch-depth: 0

      - name: Install stable Rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable

      - name: Apply bounded external-review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one review-fix anchor in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          state = Path("crates/neo-transaction/src/state.rs")
          replace_once(
              state,
              'use std::collections::BTreeSet;\n',
              'use std::cmp::Ordering;\nuse std::collections::BTreeSet;\n',
          )
          replace_once(
              state,
              '#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord, Serialize, Deserialize)]\npub struct StateTarget {',
              '#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct StateTarget {',
          )
          replace_once(
              state,
              '''impl StateTarget {
    pub(crate) fn validate(&self) -> Result<(), TransactionError> {
        if self.key.trim().is_empty() {
            return Err(TransactionError::EmptyStateTarget);
        }
        Ok(())
    }
}
''',
              '''impl StateTarget {
    pub(crate) fn identity_key(&self) -> String {
        let key = self.key.trim();
        match self.kind {
            StateTargetKind::Other => key.to_string(),
            _ => key.to_ascii_lowercase(),
        }
    }

    pub(crate) fn validate(&self) -> Result<(), TransactionError> {
        if self.key.trim().is_empty() {
            return Err(TransactionError::EmptyStateTarget);
        }
        Ok(())
    }
}

impl PartialEq for StateTarget {
    fn eq(&self, other: &Self) -> bool {
        self.kind == other.kind && self.identity_key() == other.identity_key()
    }
}

impl Eq for StateTarget {}

impl PartialOrd for StateTarget {
    fn partial_cmp(&self, other: &Self) -> Option<Ordering> {
        Some(self.cmp(other))
    }
}

impl Ord for StateTarget {
    fn cmp(&self, other: &Self) -> Ordering {
        self.kind
            .cmp(&other.kind)
            .then_with(|| self.identity_key().cmp(&other.identity_key()))
    }
}
''',
          )

          checkpoint = Path("crates/neo-transaction/src/checkpoint.rs")
          text = checkpoint.read_text(encoding="utf-8")
          if "pub fn reprobe_after_block" in text:
              raise SystemExit("reprobe_after_block already exists")
          marker = "\n    pub fn verify_postconditions(\n"
          method = '''
    pub fn reprobe_after_block(
        &mut self,
        observations: Vec<Observation>,
    ) -> Result<(), TransactionError> {
        self.require_stage(TransactionStage::Blocked)?;
        self.validate()?;
        let reboot_checkpoint = self
            .reboot_checkpoint
            .as_ref()
            .ok_or(TransactionError::MissingRebootCheckpoint)?;
        reboot_checkpoint.validate_for_checkpoint(self)?;
        let baseline = self
            .baseline
            .as_ref()
            .ok_or(TransactionError::MissingBaseline)?;
        let results = evaluate_predicates(&reboot_checkpoint.expected_post_reboot, &observations)?;
        let passed = required_results_pass(&results, baseline);
        self.resume_results = results;
        if passed {
            self.transition(
                TransactionStage::Verifying,
                "blocked post-reboot state re-proven; verification may continue",
            );
        } else {
            let changed = self.successful_applied_ids();
            if !changed.is_empty() && self.plan.all_reversible(&changed) {
                self.transition(
                    TransactionStage::RollingBack,
                    "blocked post-reboot state still unproven; rollback required",
                );
            } else {
                self.transition(
                    TransactionStage::Failed,
                    "blocked post-reboot state still unproven without complete rollback path",
                );
            }
        }
        self.validate()
    }
'''
          if text.count(marker) != 1:
              raise SystemExit("checkpoint insertion anchor mismatch")
          checkpoint.write_text(text.replace(marker, method + marker, 1), encoding="utf-8")

          invariants = Path("crates/neo-transaction/src/invariants.rs")
          replace_once(
              invariants,
              '''            | (AwaitingReboot, Verifying)
            | (AwaitingReboot, Blocked)
            | (Verifying, Complete)
''',
              '''            | (AwaitingReboot, Verifying)
            | (AwaitingReboot, Blocked)
            | (Blocked, Verifying)
            | (Blocked, RollingBack)
            | (Blocked, Failed)
            | (Verifying, Complete)
''',
          )

          tests = Path("crates/neo-transaction/src/tests.rs")
          replace_once(
              tests,
              '''    let mut second = transaction_action();
    second.action.id = "neo.fixture.tweak.second".to_string();
    second.postconditions[0].id = "fixture.enabled.second".to_string();
''',
              '''    let mut second = transaction_action();
    second.action.id = "neo.fixture.tweak.second".to_string();
    second.snapshot_targets[0].key = r"hkcu\\software\\neofixture\\enabled".to_string();
    second.postconditions[0].id = "fixture.enabled.second".to_string();
''',
          )
          text = tests.read_text(encoding="utf-8")
          marker = "\n#[test]\nfn persisted_reboot_checkpoint_tampering_is_rejected_after_resume() {"
          added_tests = '''
#[test]
fn blocked_reprobe_can_recover_to_verifying() {
    let mut action = transaction_action();
    action.action.reboot = RebootRequirement::Required;
    let plan = TransactionPlan::new("TX", 1, "MISSION", vec![action]).unwrap();
    let auth = authorization(&plan);
    let mut checkpoint = TransactionCheckpoint::new(plan).unwrap();
    checkpoint
        .capture_baseline(baseline(CapturedValue::Present("0".to_string())))
        .unwrap();
    checkpoint.authorize(auth).unwrap();
    checkpoint.begin_apply().unwrap();
    checkpoint
        .record_apply_result(ApplyRecord {
            action_id: "neo.fixture.tweak".to_string(),
            outcome: ApplyOutcome::Success,
            detail: "future executor reported success".to_string(),
        })
        .unwrap();
    checkpoint
        .resume_after_reboot(vec![Observation {
            target: target(),
            value: ObservedValue::Present("0".to_string()),
        }])
        .unwrap();
    assert_eq!(checkpoint.stage(), TransactionStage::Blocked);
    checkpoint
        .reprobe_after_block(vec![Observation {
            target: target(),
            value: ObservedValue::Present("1".to_string()),
        }])
        .unwrap();
    assert_eq!(checkpoint.stage(), TransactionStage::Verifying);
}

#[test]
fn blocked_reprobe_routes_reversible_change_to_rollback() {
    let mut action = transaction_action();
    action.action.reboot = RebootRequirement::Required;
    let plan = TransactionPlan::new("TX", 1, "MISSION", vec![action]).unwrap();
    let auth = authorization(&plan);
    let mut checkpoint = TransactionCheckpoint::new(plan).unwrap();
    checkpoint
        .capture_baseline(baseline(CapturedValue::Present("0".to_string())))
        .unwrap();
    checkpoint.authorize(auth).unwrap();
    checkpoint.begin_apply().unwrap();
    checkpoint
        .record_apply_result(ApplyRecord {
            action_id: "neo.fixture.tweak".to_string(),
            outcome: ApplyOutcome::Success,
            detail: "future executor reported success".to_string(),
        })
        .unwrap();
    checkpoint
        .resume_after_reboot(vec![Observation {
            target: target(),
            value: ObservedValue::Present("0".to_string()),
        }])
        .unwrap();
    checkpoint
        .reprobe_after_block(vec![Observation {
            target: target(),
            value: ObservedValue::Present("0".to_string()),
        }])
        .unwrap();
    assert_eq!(checkpoint.stage(), TransactionStage::RollingBack);
}
'''
          if text.count(marker) != 1:
              raise SystemExit("tests insertion anchor mismatch")
          tests.write_text(text.replace(marker, added_tests + marker, 1), encoding="utf-8")

          review = Path("tools/phase4_static_review.py")
          replace_once(
              review,
              '''TRANSACTION = "\\n".join(
    path.read_text(encoding="utf-8")
    for path in sorted((ROOT / "crates/neo-transaction/src").glob("*.rs"))
)
CLI = (ROOT / "crates/neo-cli/src/main.rs").read_text(encoding="utf-8")
''',
              '''TRANSACTION = "\\n".join(
    path.read_text(encoding="utf-8")
    for path in sorted((ROOT / "crates/neo-transaction/src").rglob("*.rs"))
)
CLI = "\\n".join(
    path.read_text(encoding="utf-8")
    for path in sorted((ROOT / "crates/neo-cli/src").rglob("*.rs"))
)
''',
          )
          replace_once(
              review,
              '        ".resume_after_reboot(",\n',
              '        ".resume_after_reboot(",\n        ".reprobe_after_block(",\n',
          )
          replace_once(
              review,
              'Lane(5, "baseline-coverage", contains_all(TRANSACTION, ["required_snapshot_targets", "BaselineCoverageMismatch", "DuplicateBaselineTarget", "OverlappingSnapshotTarget"]), "baseline must exactly cover declared snapshot targets"),',
              'Lane(5, "baseline-coverage", contains_all(TRANSACTION, ["required_snapshot_targets", "BaselineCoverageMismatch", "DuplicateBaselineTarget", "OverlappingSnapshotTarget", "identity_key"]), "baseline ownership is exact and Windows target identity is case-normalized"),',
          )
          replace_once(
              review,
              'Lane(13, "reprobe-before-resume", contains_all(TRANSACTION, ["resume_after_reboot", "post-reboot state proven", "continuation blocked"]), "post-reboot continuation requires deterministic evidence"),',
              'Lane(13, "reprobe-before-resume", contains_all(TRANSACTION, ["resume_after_reboot", "reprobe_after_block", "post-reboot state proven", "continuation blocked", "blocked post-reboot state re-proven"]), "post-reboot continuation and Blocked recovery require deterministic evidence"),',
          )
          replace_once(
              review,
              'Lane(18, "stage-invariants", contains_all(TRANSACTION, ["require_stage", "StageInvariantViolation", "InvalidStageTransition", "validate_event_log", "valid_event_transition"]), "illegal/persisted state-machine drift fails closed"),',
              'Lane(18, "stage-invariants", contains_all(TRANSACTION, ["require_stage", "StageInvariantViolation", "InvalidStageTransition", "validate_event_log", "valid_event_transition", "Blocked, Verifying", "Blocked, RollingBack", "Blocked, Failed"]), "illegal/persisted state-machine drift fails closed and Blocked has explicit recovery exits"),',
          )
          PY

      - name: Apply rustfmt to corrected Rust only
        run: cargo fmt --all

      - name: Re-run Phase 4 static review
        run: python -W error tools/phase4_static_review.py

      - name: Commit reviewed corrections if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No review corrections required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-transaction/src/state.rs crates/neo-transaction/src/checkpoint.rs crates/neo-transaction/src/invariants.rs crates/neo-transaction/src/tests.rs tools/phase4_static_review.py
          git commit -m "fix: close Phase 4 external review gaps [phase4-review-fixes]"
          git push origin HEAD:implementation/phase-4-transaction-v2
