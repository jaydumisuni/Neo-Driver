name: Phase 5 External Review Once

on:
  push:
    branches: ["implementation/phase-5-controlled-driver-install"]

permissions:
  contents: write

jobs:
  external-review-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-external-review]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-5-controlled-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply bounded external-review fixes
        shell: pwsh
        run: python tools/phase5_external_review_fixes.py
      - name: Prove all corrected contracts
        shell: pwsh
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          python -W error tools/phase5_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-transaction --locked
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven review fixes and self-clean
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/neo-transaction crates/neo-driverstore tools/phase5_static_review.py
          git rm .github/workflows/phase5-external-review-once.yml tools/phase5_external_review_fixes.py
          git commit -m "fix: close Phase 5 external review findings [phase5-external-review]"
          git push origin HEAD:implementation/phase-5-controlled-driver-install
