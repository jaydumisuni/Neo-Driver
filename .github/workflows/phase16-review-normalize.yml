name: Phase 16 Review Normalize

on:
  push:
    branches: ["implementation/phase16-debloat-executor"]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase16-debloat-executor
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize reviewed Phase 16 state
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit normalized files if changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/neo-debloat-executor
          git commit -m "Phase 16: normalize reviewed lockfile and formatting"
          git push origin HEAD:implementation/phase16-debloat-executor
