name: Phase 18 Bootstrap

on:
  push:
    branches: [implementation/phase18-debloat-restore-executor]

permissions:
  contents: write

jobs:
  materialize-normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase18-debloat-restore-executor
          fetch-depth: 0
      - name: Verify and materialize permanent Phase 18 tree
        shell: bash
        run: |
          cat .phase18_payload.aa .phase18_payload.ab .phase18_payload.ac .phase18_payload.ad .phase18_payload.ae .phase18_payload.af .phase18_payload.ag > /tmp/phase18_payload.b64
          base64 --decode /tmp/phase18_payload.b64 > /tmp/phase18_payload.tar.gz
          echo 'e634d4eb473b9a57f78a3e32ee5b2250965cddab8e2eae2bab38e260fe458c8c  /tmp/phase18_payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/phase18_payload.tar.gz -C .
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
      - name: Normalize lockfile and Rust formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Publish normalized non-workflow tree
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/ci.yml
          git rm .phase18_payload.aa .phase18_payload.ab .phase18_payload.ac .phase18_payload.ad .phase18_payload.ae .phase18_payload.af .phase18_payload.ag
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 18: add transaction-bound AppX restore executor'
          git push origin HEAD:implementation/phase18-debloat-restore-executor
