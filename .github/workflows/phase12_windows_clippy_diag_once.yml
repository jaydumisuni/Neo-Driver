name: Phase 12 one-shot Windows Clippy diagnostic

on:
  push:
    branches:
      - implementation/phase-12-mcp-rpc-tweak-authority

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Capture Phase 12 Windows Clippy diagnostic'
    runs-on: windows-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-12-mcp-rpc-tweak-authority
          fetch-depth: 0

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy --toolchain stable
          rustup default stable

      - name: Capture exact Windows Clippy output
        shell: pwsh
        run: |
          cmd /c "cargo clippy --workspace --all-targets --locked -- -D warnings > docs\PHASE12_WINDOWS_CLIPPY_DIAGNOSTIC.txt 2>&1"
          $code = $LASTEXITCODE
          Add-Content -Path docs\PHASE12_WINDOWS_CLIPPY_DIAGNOSTIC.txt -Value "CLIPPY_EXIT=$code"
          Remove-Item .github\workflows\phase12_windows_clippy_diag_once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Capture Phase 12 Windows Clippy diagnostic"
          git push origin HEAD:implementation/phase-12-mcp-rpc-tweak-authority
          exit 0
