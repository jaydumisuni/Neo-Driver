name: Phase 13 Status Helper

on:
  push:
    branches:
      - docs/phase-13-merge-proof

permissions:
  contents: write

jobs:
  patch_status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-13-merge-proof
          fetch-depth: 0
      - run: python tools/tmp_phase13_status_patch.py
      - run: |
          python -c "from pathlib import Path; p=Path('docs/IMPLEMENTATION_STATUS.md'); p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase13-status-helper.yml tools/tmp_phase13_status_patch.py
          git add docs/IMPLEMENTATION_STATUS.md
          git diff --cached --check
          git commit -m "Phase 13: record canonical implementation status"
          git push origin HEAD:docs/phase-13-merge-proof
