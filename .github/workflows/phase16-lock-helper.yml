name: Phase 16 Lock Helper

on:
  push:
    branches: ["implementation/phase16-debloat-executor"]

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase16-debloat-executor
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate exact workspace lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Phase 16: refresh exact workspace lockfile"
          git push origin HEAD:implementation/phase16-debloat-executor
