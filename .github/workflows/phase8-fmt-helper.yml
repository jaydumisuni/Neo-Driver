name: Phase 8 one-shot rustfmt

on:
  push:
    branches: ["implementation/phase-8-runtime-executor"]

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-8-runtime-executor
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
      - name: Apply canonical formatting
        run: |
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
      - name: Self-delete helper and commit formatting only
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git rm .github/workflows/phase8-fmt-helper.yml
          git add crates/neo-runtime-executor crates/neo-catalogue/src/lib.rs crates/neo-match/src/tests.rs crates/neo-runtime/src/lib.rs crates/neo-vault/src/store.rs
          git diff --cached --check
          git commit -m "Phase 8: canonicalize executor formatting"
          git push origin HEAD:implementation/phase-8-runtime-executor
