name: Phase 6 Capability Proof Once

on:
  push:
    branches: ["implementation/phase-6-managed-vault"]

permissions:
  contents: write

jobs:
  proof:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-capability-proof-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-managed-vault
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Generate exact lock and apply rustfmt
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Phase 6 structural proof
        run: python -W error tools/phase6_static_review.py

      - name: Full workspace compiler proof
        run: cargo check --workspace --all-targets --locked

      - name: Full workspace Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Vault regression proof
        run: cargo test --locked -p neo-vault --all-targets

      - name: Commit generated lock/format and self-clean
        shell: bash
        run: |
          rm .github/workflows/phase6-capability-proof-once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add Cargo.lock Cargo.toml crates/neo-vault tools/phase6_static_review.py .github/workflows/phase6-capability-proof-once.yml
          git diff --cached --check
          git commit -m "Phase 6: prove capability-held vault filesystem [phase6-capability-proof-done]"
          git push origin HEAD:implementation/phase-6-managed-vault
