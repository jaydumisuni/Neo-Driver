name: Phase 8 Status Once

on:
  push:
    branches: [docs/phase-8-merge-proof]

permissions:
  contents: write

jobs:
  patch-and-prove:
    if: ${{ !contains(github.event.head_commit.message, '[phase8-status-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/phase-8-merge-proof
          fetch-depth: 0

      - name: Apply canonical status update
        run: python tools/phase8_status_patch_once.py

      - name: Status assertions
        shell: bash
        run: |
          grep -F 'Phase 8: **PROVEN and merged**' docs/IMPLEMENTATION_STATUS.md
          grep -F '7a26d8d9dc86ac5f5db09eaf82b58424b1babd26' docs/IMPLEMENTATION_STATUS.md
          grep -F '31698767919' docs/IMPLEMENTATION_STATUS.md
          grep -F 'live runtime-installer mutation proof: **not claimed**' docs/IMPLEMENTATION_STATUS.md
          git diff --check

      - name: Restrict product diff to status record
        shell: bash
        run: |
          changed=$(git diff --name-only | grep -v '^tools/phase8_status_patch_once.py$' | grep -v '^.github/workflows/phase8-status-once.yml$' || true)
          test "$changed" = 'docs/IMPLEMENTATION_STATUS.md'

      - name: Self-clean and commit
        shell: bash
        run: |
          rm tools/phase8_status_patch_once.py .github/workflows/phase8-status-once.yml
          git add -A
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git commit -m "Docs: record Phase 8 merge proof [phase8-status-done]"
          git push origin HEAD:docs/phase-8-merge-proof
