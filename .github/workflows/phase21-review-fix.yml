name: Phase 21 corrected-head review fix

on:
  push:
    branches:
      - implementation/phase21-repair-windows-features
    paths:
      - .github/workflows/phase21-review-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 21 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase21-repair-windows-features
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply bounded review corrections
        run: |
          python tools/phase21_apply_review_fix.py
          git checkout HEAD -- .github/workflows/phase21-review-fix.yml

      - name: Format and prove correction
        run: |
          cargo fmt --all
          python -W error tools/phase21_static_review.py
          cargo test --locked -p neo-repair command::tests::trusted_command_contract_is_exact
          cargo test --locked -p neo-repair rpc::tests
          cargo test --locked -p neo-repair
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          git diff --check

      - name: Commit corrected Phase 21 head
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Phase 21 corrected-head review findings"
          git push origin HEAD:implementation/phase21-repair-windows-features
