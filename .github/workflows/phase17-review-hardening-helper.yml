name: Phase 17 Review Hardening Helper

on:
  push:
    branches: ["implementation/phase17-debloat-history-restore-readiness"]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase17-debloat-history-restore-readiness
      - name: Apply exact durability hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one marker in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "crates/neo-debloat-history/src/model.rs",
              '''        if source_plan.actions().len() != 1
            || source_plan.actions()[0].action.id != self.debloat_id
            || source_plan.actions()[0].action.kind != neo_core::ActionKind::Debloat
        {
            return Err(DebloatHistoryError::InvalidReceipt(
                "source checkpoint does not contain exactly the completed Debloat action"
                    .to_string(),
            ));
        }
''',
              '''        if source_plan.actions().len() != 1 {
            return Err(DebloatHistoryError::InvalidReceipt(
                "source checkpoint does not contain exactly one completed Debloat action"
                    .to_string(),
            ));
        }
        let source_action = &source_plan.actions()[0].action;
        if source_action.id != self.debloat_id
            || source_action.kind != neo_core::ActionKind::Debloat
            || source_action.verdict != neo_core::EvidenceVerdict::Certified
            || !source_action.requires_confirmation
            || !source_action.rollback_available
            || source_action.selected_by_default
        {
            return Err(DebloatHistoryError::InvalidReceipt(
                "source checkpoint action is not the certified confirmed reversible non-default Debloat authority expected from Phase 15/16"
                    .to_string(),
            ));
        }
''')

          replace_once(
              "crates/neo-debloat-history/src/plan.rs",
              '''    left.name.eq_ignore_ascii_case(&right.name)
        && left.full_name.eq_ignore_ascii_case(&right.full_name)
        && left.family_name.eq_ignore_ascii_case(&right.family_name)
        && left.dependencies.len() == right.dependencies.len()
''',
              '''    left.name.eq_ignore_ascii_case(&right.name)
        && left.full_name.eq_ignore_ascii_case(&right.full_name)
        && left.family_name.eq_ignore_ascii_case(&right.family_name)
        && left.is_framework == right.is_framework
        && left.is_resource == right.is_resource
        && left.is_bundle == right.is_bundle
        && left.is_optional == right.is_optional
        && left.dependencies.len() == right.dependencies.len()
''')

          replace_once(
              "crates/neo-debloat-history/src/tests.rs",
              '''#[test]
fn missing_exact_staged_dependency_blocks_restore_readiness() {
''',
              '''#[test]
fn staged_main_kind_flag_drift_blocks_restore_readiness() {
    let receipt = receipt();
    let mut inventory = restore_inventory(false);
    inventory.provisioned[0].is_optional = true;
    inventory.validate().expect("inventory must remain valid");

    let error = prepare_restore_from_inventory(&receipt, &inventory, "mission-kind-drift")
        .expect_err("staged package-kind drift must block deterministic restore");
    assert!(matches!(error, DebloatHistoryError::RestoreNotReady(_)));
}

#[test]
fn missing_exact_staged_dependency_blocks_restore_readiness() {
''')

          replace_once(
              "docs/decisions/0017-PHASE17-DEBLOAT-HISTORY-RESTORE-READINESS.md",
              '''A receipt may be created only from a Phase 16 `DebloatExecutionSession` whose checkpoint is exactly `Complete` and whose execution-plan/checkpoint transaction fingerprints still agree.
''',
              '''A receipt may be created only from a Phase 16 `DebloatExecutionSession` whose checkpoint is exactly `Complete` and whose execution-plan/checkpoint transaction fingerprints still agree. Durable validation also requires that the completed source contains exactly one `Debloat` action and that action remains `Certified`, explicit-confirmation-required, reversible, and not selected by default—the authority shape frozen by the Phase 15→16 path.
''')

          replace_once(
              "docs/decisions/0017-PHASE17-DEBLOAT-HISTORY-RESTORE-READINESS.md",
              '''4. the staged main identity still has the same direct dependency identity shape recorded by the receipt;
''',
              '''4. the staged main identity still has the same package-kind flags and direct dependency identity shape recorded by the receipt;
''')

          replace_once(
              "docs/PHASE17_20_LANE_REVIEW.md",
              '''5. Receipt schema is explicitly versioned and durable JSON deserialization revalidates the complete source checkpoint.
''',
              '''5. Receipt schema is explicitly versioned and durable JSON deserialization revalidates the complete source checkpoint plus the certified, confirmation-required, reversible, non-default source Debloat action shape.
''')

          replace_once(
              "docs/PHASE17_20_LANE_REVIEW.md",
              '''12. Exact staged/provisioned main full-name + family identity must still exist and retain the receipt dependency shape.
''',
              '''12. Exact staged/provisioned main full-name + family identity must still exist and retain the receipt package-kind flags plus dependency shape.
''')

          replace_once(
              "tools/phase17_static_review.py",
              '''        and "source_checkpoint: TransactionCheckpoint" in model,
''',
              '''        and "source_checkpoint: TransactionCheckpoint" in model
        and "source_action.verdict != neo_core::EvidenceVerdict::Certified" in model
        and "!source_action.requires_confirmation" in model
        and "!source_action.rollback_available" in model
        and "source_action.selected_by_default" in model,
''')

          replace_once(
              "tools/phase17_static_review.py",
              '''        and "same_main_restore_shape(main, receipt.main())" in plan
        and "missing_exact_staged_main_blocks_restore_readiness" in tests,
''',
              '''        and "same_main_restore_shape(main, receipt.main())" in plan
        and "left.is_framework == right.is_framework" in plan
        and "left.is_resource == right.is_resource" in plan
        and "left.is_bundle == right.is_bundle" in plan
        and "left.is_optional == right.is_optional" in plan
        and "missing_exact_staged_main_blocks_restore_readiness" in tests
        and "staged_main_kind_flag_drift_blocks_restore_readiness" in tests,
''')

          replace_once(
              "tools/phase17_static_review.py",
              '''            "missing_exact_staged_main_blocks_restore_readiness",
            "missing_exact_staged_dependency_blocks_restore_readiness",
''',
              '''            "missing_exact_staged_main_blocks_restore_readiness",
            "staged_main_kind_flag_drift_blocks_restore_readiness",
            "missing_exact_staged_dependency_blocks_restore_readiness",
''')
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize hardened Rust
        run: cargo fmt --all
      - name: Commit hardening and remove helper
        shell: bash
        run: |
          git rm .github/workflows/phase17-review-hardening-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-debloat-history docs tools/phase17_static_review.py
          git commit -m "Phase 17: harden durable receipt and staged identity proof"
          git push origin HEAD:implementation/phase17-debloat-history-restore-readiness
