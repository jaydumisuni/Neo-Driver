name: Phase 17 Normalize Helper

on:
  push:
    branches: ["implementation/phase17-debloat-history-restore-readiness"]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase17-debloat-history-restore-readiness
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize exact workspace state
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit normalized files if changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/neo-debloat-history
          git commit -m "Phase 17: normalize lockfile and Rust formatting"
          git push origin HEAD:implementation/phase17-debloat-history-restore-readiness
