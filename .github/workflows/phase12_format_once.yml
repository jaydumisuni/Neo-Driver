name: Phase 12 one-shot rustfmt

on:
  push:
    branches:
      - implementation/phase-12-mcp-rpc-tweak-authority

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply canonical Rust formatting for Phase 12'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-12-mcp-rpc-tweak-authority
          fetch-depth: 0

      - name: Install stable Rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable

      - name: Format and self-clean
        run: |
          cargo fmt --all
          rm .github/workflows/phase12_format_once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply canonical Rust formatting for Phase 12"
          git push origin HEAD:implementation/phase-12-mcp-rpc-tweak-authority
