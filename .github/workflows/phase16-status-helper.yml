name: Phase 16 Canonical Status Helper

on:
  push:
    branches: ["docs/phase16-final-status"]

permissions:
  contents: write

jobs:
  update-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase16-final-status
      - name: Insert canonical Phase 16 recovery record
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/IMPLEMENTATION_STATUS.md")
          text = path.read_text(encoding="utf-8")
          phase16_bullet = "- **Phase 16:** merged and engineering-proven — internal capability-gated transaction-bound current-user AppX executor over exactly one Phase 15 prepared transaction, with two fresh exact baseline-drift checks, same-session serialization, native PackageManager full-name removal, terminal AsyncStatus + DeploymentResult validation, all-target change evidence, Phase 4 forward verification, exact staged full-name dependency-aware rollback, and Phase 4 MatchesBaseline recovery verification. Live destructive AppX mutation, post-success user undo, provisioned/all-users/batch mutation, Store/network restore, public GUI/CLI writes, plugin dependency, and MCP/RPC Debloat authority remain blocked.\n"
          if phase16_bullet not in text:
              anchor = "- **Phase 15:** merged and engineering-proven — read-only exact AppX identity, rollback-readiness, and Phase 4 transaction-preparation boundary for exactly one Phase 13 current-user removal candidate, using native Windows PackageManager current-user/provisioned inventories, exact package/dependency full/family identities, exact provisioned staged twins for the selected package and every direct dependency, constructor-owned externally read-only prepared state, a BaselineCaptured checkpoint with transaction-plan fingerprint continuity, deterministic Ubuntu/Windows fixture proof, and real non-empty Windows native inventory proof. AppX removal/re-registration execution, deprovision/provision execution, Store/network restore, batch/all-users mutation, public GUI/CLI writes, plugin dependency, and MCP/RPC debloat capability remain blocked.\n"
              if anchor not in text:
                  raise SystemExit("Phase 15 current-state anchor not found")
              text = text.replace(anchor, anchor + phase16_bullet, 1)

          phase16_baseline = "Phase 16 corrected implementation head `71d4aaf2937914303238808a8d81bb7054fd3150` passed complete independent push run `31920604965` and PR run `31920607582` on Ubuntu and Windows. CodeRabbit completed a full review and identified one actionable native async-completion correctness issue plus three robustness findings. The async-status result handling, compound removal+rollback failure diagnostics, and post-write observation-loss regression were corrected and the actionable inline thread was resolved. The historical/versioned baseline-encoding suggestion was not applied because Phase 16 accepts only constructor-produced Phase 15 prepared state rather than historical/deserialized prepared-state compatibility authority; Phase 15 canonicalizes package and dependency ordering before baseline capture. No second CodeRabbit PASS is claimed. GitGuardian scanned all 41 corrected implementation commits with no secrets detected. Phase 16 merged through PR #32 as `878db7515b26c06529e2dfcd157d652b3119498c`, and merged-main run `31920819243` then passed the complete Ubuntu and Windows Phase 1–16 pipeline. Live destructive AppX mutation and post-success user-triggered undo are explicitly not claimed.\n\n"
          if phase16_baseline not in text:
              marker = "\n## Phase 5 frozen implementation\n"
              if marker not in text:
                  raise SystemExit("Proven-baseline section terminator not found")
              text = text.replace(marker, "\n" + phase16_baseline + "## Phase 5 frozen implementation\n", 1)
          path.write_text(text, encoding="utf-8")
      - name: Remove helper and commit one-file cumulative status delta
        shell: bash
        run: |
          git rm .github/workflows/phase16-status-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md
          git commit -m "Phase 16: record canonical implementation status"
          git push origin HEAD:docs/phase16-final-status
