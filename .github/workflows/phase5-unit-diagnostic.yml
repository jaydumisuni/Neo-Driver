name: Phase 5 Correction Helper

on:
  push:
    branches: ["implementation/phase-5-controlled-driver-install"]

permissions:
  contents: write

jobs:
  correct-prove-and-clean:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-5-controlled-driver-install
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply evidence-backed corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          windows = Path("crates/neo-driverstore/src/windows.rs")
          text = windows.read_text(encoding="utf-8")
          old_import = "use windows::Win32::Devices::Properties::{DEVPKEY_Device_DriverInfPath, DEVPROPKEY, DEVPROPTYPE};"
          new_import = "use windows::Win32::Devices::Properties::{DEVPKEY_Device_DriverInfPath, DEVPROPTYPE};"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected DEVPROPKEY import anchor count")
          text = text.replace(old_import, new_import)
          old_param = "    property: &DEVPROPKEY,"
          new_param = "    property: &windows::Win32::Foundation::DEVPROPKEY,"
          if text.count(old_param) != 1:
              raise SystemExit("unexpected DEVPROPKEY parameter anchor count")
          text = text.replace(old_param, new_param)
          windows.write_text(text, encoding="utf-8")

          tests = Path("crates/neo-driverstore/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          pattern = re.compile(
              r'#\[test\]\nfn staging_failure_with_recovered_identity_routes_rollback\(\) \{.*?\n\}\n\n(?=#\[test\]\nfn staging_failure_without_recoverable_identity_never_claims_no_change)',
              re.DOTALL,
          )
          replacement = '''#[test]
          fn staging_failure_with_recovered_identity_restores_store_and_fails_without_net_change() {
              let fixture = Fixture::new(None);
              let mut session = fixture.session();
              fixture
                  .host
                  .configure(|state| state.stage_error_after_insert = true);
              session.apply(&fixture.host).unwrap();
              assert_eq!(session.transaction().stage(), TransactionStage::Failed);
              assert!(session.target_package().is_some());
              let packages = &fixture.host.state.borrow().packages;
              assert!(packages.contains_key("oem1.inf"));
              assert!(!packages.contains_key("oem42.inf"));
          }

          '''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"unexpected staging regression anchor count: {count}")
          tests.write_text(text, encoding="utf-8")

          gate = Path("tools/phase5_static_review.py")
          text = gate.read_text(encoding="utf-8")
          old_name = '"staging_failure_with_recovered_identity_routes_rollback",'
          new_name = '"staging_failure_with_recovered_identity_restores_store_and_fails_without_net_change",'
          if text.count(old_name) != 1:
              raise SystemExit("unexpected static-gate staging regression anchor count")
          gate.write_text(text.replace(old_name, new_name), encoding="utf-8")
          '@ | python -
          Remove-Item .github/workflows/phase5-unit-diagnostic.yml
      - name: Phase 4 regression gate
        run: python -W error tools/phase4_static_review.py
      - name: Phase 5 static gate
        run: python -W error tools/phase5_static_review.py
      - name: Rust formatting proof
        run: cargo fmt --all -- --check
      - name: Windows workspace type proof
        run: cargo check --workspace --all-targets --locked
      - name: Windows Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows unit proof
        run: cargo test --workspace --all-targets --locked
      - name: Diff proof
        run: git diff --check
      - name: Commit proven correction and self-clean
        shell: pwsh
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "correction helper produced no changes" }
          git commit -m "test: align staging failure with net-mutation contract"
          git push origin HEAD:implementation/phase-5-controlled-driver-install
