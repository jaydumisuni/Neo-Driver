name: Phase 5 Unit Diagnostic

on:
  push:
    branches: ["implementation/phase-5-controlled-driver-install"]

permissions:
  contents: read

jobs:
  driverstore-aggregate-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-5-controlled-driver-install
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: List all driverstore tests
        run: cargo test -p neo-driverstore --locked -- --list
      - name: Serialized driverstore suite
        run: cargo test -p neo-driverstore --all-targets --locked -- --test-threads=1
      - name: Normal parallel driverstore suite
        run: cargo test -p neo-driverstore --all-targets --locked
      - name: Workspace unit proof serialized
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
