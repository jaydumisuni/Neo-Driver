name: Phase 11 lock once

on:
  push:
    branches: ["implementation/phase-11-tweak-executor"]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[phase11-lock-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - name: Generate exact lock
        run: cargo generate-lockfile
      - name: Verify bounded graph delta
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "Cargo.lock"
          grep -F 'name = "neo-tweak-executor"' Cargo.lock
      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git rm .github/workflows/phase11-lock-once.yml
          git add Cargo.lock
          git commit -m 'Lock Phase 11 workspace graph [phase11-lock-done]'
          git push origin HEAD:implementation/phase-11-tweak-executor
