name: Phase 8 one-shot compiler correction

on:
  push:
    branches: ["implementation/phase-8-runtime-executor"]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-8-runtime-executor
          fetch-depth: 0
      - name: Apply exact compiler-proven corrections
        shell: python
        run: |
          from pathlib import Path

          test_path = Path("crates/neo-driverstore/src/tests.rs")
          text = test_path.read_text(encoding="utf-8")
          old = "            }],\n            dependencies: vec![],\n            conflicts: vec![],\n            security: SecurityRequirements::default(),"
          new = "            }],\n            runtime_execution: None,\n            dependencies: vec![],\n            conflicts: vec![],\n            security: SecurityRequirements::default(),"
          if text.count(old) != 1:
              raise SystemExit(f"driverstore compatibility site count={text.count(old)}")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cargo = Path("Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          old = '    "Win32_Foundation",\n    "Win32_System_Diagnostics_Debug",'
          new = '    "Win32_Foundation",\n    "Win32_Security",\n    "Win32_System_Diagnostics_Debug",'
          if text.count(old) != 1:
              raise SystemExit("expected one Win32_Security feature insertion point")
          cargo.write_text(text.replace(old, new, 1), encoding="utf-8")

          model = Path("crates/neo-runtime-executor/src/model.rs")
          text = model.read_text(encoding="utf-8")
          import_old = "use std::path::{Path, PathBuf};"
          if text.count(import_old) != 1:
              raise SystemExit(f"Path import count={text.count(import_old)}")
          text = text.replace(import_old, "use std::path::PathBuf;", 1)
          dead = '''\npub(crate) fn ensure_same_path(expected: &Path, actual: &Path) -> Result<(), RuntimeExecutorError> {\n    if expected != actual {\n        return Err(RuntimeExecutorError::InvalidPlan(\n            "runtime payload path is not the derived vault path".to_string(),\n        ));\n    }\n    Ok(())\n}\n'''
          if text.count(dead) != 1:
              raise SystemExit(f"dead helper count={text.count(dead)}")
          model.write_text(text.replace(dead, "\n", 1), encoding="utf-8")
      - name: Canonical formatting and diff proof
        run: |
          cargo fmt --all
          git diff --check
          git diff -- Cargo.toml crates/neo-driverstore/src/tests.rs crates/neo-runtime-executor/src/model.rs
      - name: Self-delete helper and commit corrections
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git rm .github/workflows/phase8-compiler-correction.yml
          git add Cargo.toml crates/neo-driverstore/src/tests.rs crates/neo-runtime-executor/src/model.rs
          git diff --cached --check
          git commit -m "Phase 8: apply compiler-proven runtime corrections"
          git push origin HEAD:implementation/phase-8-runtime-executor
