name: Phase 12 one-shot authority review corrections

on:
  push:
    branches:
      - implementation/phase-12-mcp-rpc-tweak-authority

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message != 'Close Phase 12 authority review findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-12-mcp-rpc-tweak-authority
          fetch-depth: 0

      - name: Apply authority corrections
        run: |
          python tools/phase12_authority_review_corrections.py
          cargo fmt --all
          rm tools/phase12_authority_review_corrections.py
          rm .github/workflows/phase12_authority_review_once.yml

      - name: Commit corrections
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Close Phase 12 authority review findings"
          git push origin HEAD:implementation/phase-12-mcp-rpc-tweak-authority
