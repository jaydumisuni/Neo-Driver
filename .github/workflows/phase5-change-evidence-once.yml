name: Phase 5 Change Evidence Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  change-evidence-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-change-evidence]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply machine-change evidence prerequisite
        run: python tools/phase5_transaction_change_evidence_patch.py

      - name: Format and prove prerequisite
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-transaction --locked

      - name: Commit prerequisite and remove helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-transaction/src/plan.rs crates/neo-transaction/src/checkpoint.rs crates/neo-transaction/src/invariants.rs crates/neo-transaction/src/tests.rs
          git rm .github/workflows/phase5-change-evidence-once.yml tools/phase5_transaction_change_evidence_patch.py
          git commit -m "feat: separate transaction change evidence from API outcome [phase5-change-evidence]"
          git push origin HEAD:staging-phase5-driver-install
