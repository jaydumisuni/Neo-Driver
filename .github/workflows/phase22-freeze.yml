name: Phase 22 freeze recorder

on:
  push:
    branches:
      - implementation/phase22-driver-pnp-assessment
    paths:
      - .github/workflows/phase22-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase22-driver-pnp-assessment
          fetch-depth: 0
      - name: Record exact proven Phase 22 boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          decision = 'docs/decisions/0022-PHASE22-DRIVER-PNP-REPAIR-ASSESSMENT.md'
          replace_once(decision,
              '**Status:** ACCEPTED FOR IMPLEMENTATION PROOF',
              '**Status:** FROZEN AND PROVEN')
          replace_once(decision,
              '3. resolve the active Windows-published INF to the exact current Driver Store package through the existing Phase 5 read authority;',
              '3. when the active binding is a Phase 5 OEM published INF (`oem<digits>.inf`), resolve it to the exact current Driver Store package through the existing Phase 5 read authority; inbox/system INF identities remain valid active-binding evidence but do not become Phase 5 reversible package authority;')
          replace_once(decision,
              '- `resolve_published_package()` for exact current Driver Store package resolution.',
              '- `resolve_published_package()` only for active Phase 5 OEM published INF identities (`oem<digits>.inf`); inbox/system INF identities remain visible binding evidence and are conservatively represented without exact reversible package evidence.')
          replace_once(decision,
              'Case-insensitive duplicate device instance IDs fail closed. PnP status that disagrees with inherited Phase 5 problem-code evidence fails closed. Driver Store package evidence without an active published INF fails closed. A resolved package whose published identity does not equal the active published INF fails closed.',
              'Case-insensitive duplicate device instance IDs fail closed. PnP status that disagrees with inherited Phase 5 problem-code evidence fails closed. Driver Store package evidence without an active published INF fails closed. A resolved package whose published identity does not equal the active published INF fails closed. Raw SetupAPI hardware/compatible-ID lists are stable-deduplicated at the Windows evidence boundary while preserving first-occurrence ranking order. Inbox/system INF bindings such as `machine.inf` are retained as binding evidence but never promoted into Phase 5 OEM rollback-package authority.')
          replace_once(decision,
              '- A published INF that cannot resolve to an exact current package cannot establish reversible repair readiness.',
              '- A Phase 5 OEM published INF that cannot resolve to an exact current package cannot establish reversible repair readiness.\n- A valid inbox/system INF binding is not an error, but because it is outside Phase 5 OEM rollback-package authority it carries no exact reversible-package claim and cannot become an exact-current-driver reinstall candidate.')
          replace_once(decision,
              '- regression proof that Code 22 is disabled and cannot become a reinstall candidate;',
              '- regression proof that Code 22 is disabled and cannot become a reinstall candidate;\n- regression proof that duplicate SetupAPI IDs preserve first-occurrence order after normalization and that only `oem<digits>.inf` enters Phase 5 exact-package resolution;')
          replace_once(decision,
              'Live driver/PnP mutation is explicitly unclaimed.',
              '''## Frozen implementation proof

The final source implementation proof head before this freeze record is `402216945dee41ac5b44001f9cf62026544fea4b`. Neo Driver CI run `32531907420` completed successfully on both Ubuntu and Windows. The Windows lane passed the complete inherited Phase 1–22 chain and the real bounded `neo repair drivers --json` live source probe.

That live campaign found and corrected two Windows evidence defects before freeze: duplicate raw SetupAPI hardware/compatible IDs are now stable-deduplicated without changing first-occurrence ranking order, and valid inbox/system INF bindings no longer enter Phase 5's OEM-only exact rollback-package resolver. Neither correction grants mutation authority.

Live driver/PnP mutation is explicitly unclaimed.''')

          review = 'docs/PHASE22_20_LANE_REVIEW.md'
          replace_once(review,
              '| 04 | Live collection uses only `DriverHost::inventory()` and `resolve_published_package()`. |',
              '| 04 | Live collection uses only `DriverHost::inventory()` plus OEM-only `resolve_published_package()`; inbox/system INF bindings remain read evidence and never enter Phase 5 reversible package authority. |')

          checker = 'tools/phase22_static_review.py'
          replace_once(checker,
              '''        len(forbidden_host_mutators) == 4
        and capture_host_calls == ALLOWED_PHASE22_HOST_CALLS
        and production_host_calls <= ALLOWED_PHASE22_HOST_CALLS,''',
              '''        len(forbidden_host_mutators) == 4
        and capture_host_calls == ALLOWED_PHASE22_HOST_CALLS
        and production_host_calls <= ALLOWED_PHASE22_HOST_CALLS
        and "is_phase5_oem_published_inf" in ASSESS
        and "only_phase5_oem_published_inf_enters_exact_package_resolution" in ASSESS
        and "machine.inf" in ASSESS
        and "usbport.inf" in ASSESS,''')
          PY
      - name: Prove freeze contracts
        run: |
          python -W error tools/phase5_static_review.py
          python -W error tools/phase22_static_review.py
          git diff --check
      - name: Commit freeze record only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/0022-PHASE22-DRIVER-PNP-REPAIR-ASSESSMENT.md docs/PHASE22_20_LANE_REVIEW.md tools/phase22_static_review.py
          changed=$(git diff --cached --name-only)
          expected=$(printf '%s\n' docs/PHASE22_20_LANE_REVIEW.md docs/decisions/0022-PHASE22-DRIVER-PNP-REPAIR-ASSESSMENT.md tools/phase22_static_review.py)
          if [ "$changed" != "$expected" ]; then
            echo "unexpected staged files"
            printf '%s\n' "$changed"
            exit 1
          fi
          git commit -m "docs: freeze proven Phase 22 boundary"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
