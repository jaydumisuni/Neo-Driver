name: Phase 22 Rustfmt sync

on:
  push:
    branches:
      - implementation/phase22-driver-pnp-assessment

permissions:
  contents: write

jobs:
  sync-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install stable Rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable

      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "crates/neo-driverstore/src/windows.rs"

      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore/src/windows.rs
          git commit -m "chore: format Rust 1.98 compatibility correction"
          git push origin HEAD:${{ github.ref_name }}
