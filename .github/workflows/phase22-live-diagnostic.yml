name: Phase 22 inbox-INF correction helper

on:
  push:
    branches:
      - implementation/phase22-driver-pnp-assessment
    paths:
      - .github/workflows/phase22-live-diagnostic.yml

permissions:
  contents: write

jobs:
  apply-and-prove:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase22-driver-pnp-assessment
          fetch-depth: 0
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply exact inbox-INF read-boundary correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('crates/neo-driverstore/src/windows.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        if !is_safe_published_name(published_inf) {
            return Err(DriverStoreError::InvalidStoredPackage);
        }
        let published_path = windows_inf_dir()?.join(published_inf);'''
          new = '''        if !is_safe_inf_basename(published_inf) {
            return Err(DriverStoreError::InvalidStoredPackage);
        }
        if !is_safe_published_name(published_inf) {
            return Ok(None);
        }
        let published_path = windows_inf_dir()?.join(published_inf);'''
          if text.count(old) != 1:
              raise SystemExit(f'resolve anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''fn is_safe_published_name(value: &str) -> bool {
    let lower = value.to_ascii_lowercase();
    if value.contains(['\\\\', '/']) || !lower.starts_with("oem") || !lower.ends_with(".inf") {
        return false;
    }
    let digits = &lower[3..lower.len() - 4];
    !digits.is_empty() && digits.chars().all(|character| character.is_ascii_digit())
}'''
          new = '''fn is_safe_inf_basename(value: &str) -> bool {
    let trimmed = value.trim();
    !trimmed.is_empty()
        && trimmed == value
        && !value.contains(['\\\\', '/'])
        && value.to_ascii_lowercase().ends_with(".inf")
        && value.len() > 4
}

fn is_safe_published_name(value: &str) -> bool {
    let lower = value.to_ascii_lowercase();
    if !is_safe_inf_basename(value) || !lower.starts_with("oem") {
        return false;
    }
    let digits = &lower[3..lower.len() - 4];
    !digits.is_empty() && digits.chars().all(|character| character.is_ascii_digit())
}'''
          if text.count(old) != 1:
              raise SystemExit(f'predicate anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    fn published_name_requires_numeric_oem_index() {
        assert!(is_safe_published_name("oem0.inf"));
        assert!(is_safe_published_name("OEM42.INF"));
        assert!(!is_safe_published_name("oem.inf"));
        assert!(!is_safe_published_name("oemx.inf"));
        assert!(!is_safe_published_name(r"sub\\oem1.inf"));
    }'''
          new = '''    fn published_name_requires_numeric_oem_index() {
        assert!(is_safe_inf_basename("machine.inf"));
        assert!(is_safe_inf_basename("usbport.inf"));
        assert!(!is_safe_inf_basename(r"sub\\machine.inf"));
        assert!(!is_safe_inf_basename(" machine.inf"));
        assert!(!is_safe_inf_basename("machine"));
        assert!(is_safe_published_name("oem0.inf"));
        assert!(is_safe_published_name("OEM42.INF"));
        assert!(!is_safe_published_name("machine.inf"));
        assert!(!is_safe_published_name("oem.inf"));
        assert!(!is_safe_published_name("oemx.inf"));
        assert!(!is_safe_published_name(r"sub\\oem1.inf"));
    }'''
          if text.count(old) != 1:
              raise SystemExit(f'test anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
      - name: Format and static review
        shell: pwsh
        run: |
          cargo fmt --all
          python -W error tools/phase5_static_review.py
          python -W error tools/phase22_static_review.py
      - name: Focused proof
        shell: pwsh
        run: |
          cargo test --locked -p neo-driverstore
          cargo test --locked -p neo-driver-repair
          cargo clippy --locked -p neo-driverstore -p neo-driver-repair --all-targets -- -D warnings
      - name: Commit only corrected product source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore/src/windows.rs
          $changed = git diff --cached --name-only
          if ($changed -ne 'crates/neo-driverstore/src/windows.rs') {
            Write-Error "unexpected staged files: $changed"
            exit 1
          }
          git commit -m "fix: treat inbox INF as read-only unresolved package evidence"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
