name: Phase 12 one-shot master plan patch

on:
  push:
    branches:
      - implementation/phase-12-mcp-rpc-tweak-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Reconcile master plan with MCP RPC control plane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-12-mcp-rpc-tweak-authority
          fetch-depth: 0

      - name: Apply master plan patch
        run: python tools/phase12_reconcile_master_plan.py

      - name: Self-clean and commit
        run: |
          rm tools/phase12_reconcile_master_plan.py
          rm .github/workflows/phase12_master_plan_patch_once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile master plan with MCP RPC control plane"
          git push origin HEAD:implementation/phase-12-mcp-rpc-tweak-authority
