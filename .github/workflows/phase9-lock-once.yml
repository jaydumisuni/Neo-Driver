name: Phase 9 Lock Once

on:
  push:
    branches: [implementation/phase-9-typed-tweaks]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-9-typed-tweaks
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Generate and prove lock
        run: |
          cargo generate-lockfile
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-state-plan --all-targets --locked
      - name: Self-clean and commit
        run: |
          rm .github/workflows/phase9-lock-once.yml
          git add Cargo.lock .github/workflows/phase9-lock-once.yml
          git diff --cached --exit-code && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 9: refresh lock after state assessment crate"
          git push origin HEAD:implementation/phase-9-typed-tweaks
