name: Phase 22 normalize Windows device IDs

on:
  push:
    branches:
      - implementation/phase22-driver-pnp-assessment

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase22-driver-pnp-assessment
          fetch-depth: 0

      - name: Apply evidence-backed SetupAPI normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/neo-driverstore/src/windows.rs")
          text = path.read_text(encoding="utf-8")

          old = '''fn registry_multisz(
              set: HDEVINFO,
              data: &SP_DEVINFO_DATA,
              property: windows::Win32::Devices::DeviceAndDriverInstallation::SETUP_DI_REGISTRY_PROPERTY,
          ) -> Result<Vec<String>, DriverStoreError> {
              Ok(registry_property_wide(set, data, property)?
                  .map(|values| utf16_multisz(&values))
                  .unwrap_or_default())
          }
          '''
          new = '''fn registry_multisz(
              set: HDEVINFO,
              data: &SP_DEVINFO_DATA,
              property: windows::Win32::Devices::DeviceAndDriverInstallation::SETUP_DI_REGISTRY_PROPERTY,
          ) -> Result<Vec<String>, DriverStoreError> {
              let values = registry_property_wide(set, data, property)?
                  .map(|values| utf16_multisz(&values))
                  .unwrap_or_default();
              Ok(stable_unique(values))
          }

          fn stable_unique(values: Vec<String>) -> Vec<String> {
              let mut unique = Vec::with_capacity(values.len());
              for value in values {
                  if !unique.contains(&value) {
                      unique.push(value);
                  }
              }
              unique
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one registry_multisz block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_test_anchor = '''mod windows_tests {
              use super::*;

              #[test]
              fn published_name_requires_numeric_oem_index() {
          '''
          new_test_anchor = '''mod windows_tests {
              use super::*;

              #[test]
              fn setupapi_id_normalization_removes_exact_duplicates_without_reordering() {
                  let values = vec![
                      r"COMPUTER\\{A}".to_string(),
                      r"COMPUTER\\{A}".to_string(),
                      r"PCI\\VEN_1234&DEV_5678".to_string(),
                      r"COMPUTER\\{A}".to_string(),
                  ];
                  assert_eq!(
                      stable_unique(values),
                      vec![
                          r"COMPUTER\\{A}".to_string(),
                          r"PCI\\VEN_1234&DEV_5678".to_string(),
                      ]
                  );
              }

              #[test]
              fn published_name_requires_numeric_oem_index() {
          '''
          if text.count(old_test_anchor) != 1:
              raise SystemExit(f"expected exactly one windows_tests anchor, found {text.count(old_test_anchor)}")
          text = text.replace(old_test_anchor, new_test_anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Commit exact correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore/src/windows.rs
          git commit -m "fix(phase22): normalize duplicate SetupAPI device IDs"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
