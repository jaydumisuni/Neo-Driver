name: Phase 8 one-shot lock-model cleanup

on:
  push:
    branches: ["implementation/phase-8-runtime-executor"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-8-runtime-executor
          fetch-depth: 0
      - name: Remove stale path-lock model
        shell: python
        run: |
          from pathlib import Path

          model = Path("crates/neo-runtime-executor/src/model.rs")
          text = model.read_text(encoding="utf-8")
          lock_method = '''\n    pub fn lock_path(&self) -> Result<PathBuf, RuntimeExecutorError> {\n        Ok(self.layout()?.sessions().join("runtime-executor.lock"))\n    }\n'''
          if text.count(lock_method) != 1:
              raise SystemExit(f"lock_path method count={text.count(lock_method)}")
          text = text.replace(lock_method, "", 1)
          old = '''    pub arguments: Vec<String>,\n    pub execution_lock: PathBuf,\n}\n\nimpl RuntimeInvocation {\n    pub fn validate(&self) -> Result<(), RuntimeExecutorError> {\n        if self.payload.as_os_str().is_empty() || self.execution_lock.as_os_str().is_empty() {\n            return Err(RuntimeExecutorError::InvalidPlan(\n                "runtime invocation paths cannot be empty".to_string(),\n            ));\n        }\n        Ok(())\n    }\n}\n'''
          new = '''    pub arguments: Vec<String>,\n}\n\nimpl RuntimeInvocation {\n    pub fn validate(&self) -> Result<(), RuntimeExecutorError> {\n        if self.payload.as_os_str().is_empty() {\n            return Err(RuntimeExecutorError::InvalidPlan(\n                "runtime invocation payload path cannot be empty".to_string(),\n            ));\n        }\n        Ok(())\n    }\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"RuntimeInvocation path-lock block count={text.count(old)}")
          model.write_text(text.replace(old, new, 1), encoding="utf-8")

          executor = Path("crates/neo-runtime-executor/src/executor.rs")
          text = executor.read_text(encoding="utf-8")
          old = '''            expected_sha256: self.plan.package_sha256.clone(),\n            arguments: self.plan.execution_args()?,\n            execution_lock: self.plan.lock_path()?,\n'''
          new = '''            expected_sha256: self.plan.package_sha256.clone(),\n            arguments: self.plan.execution_args()?,\n'''
          if text.count(old) != 1:
              raise SystemExit(f"executor invocation lock field count={text.count(old)}")
          executor.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format and prove exact surface
        run: |
          cargo fmt --all
          git diff --check
          git diff -- crates/neo-runtime-executor/src/model.rs crates/neo-runtime-executor/src/executor.rs
      - name: Self-delete helper and commit
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git rm .github/workflows/phase8-lock-model-cleanup.yml
          git add crates/neo-runtime-executor/src/model.rs crates/neo-runtime-executor/src/executor.rs
          git diff --cached --check
          git commit -m "Phase 8: remove stale path-lock authority"
          git push origin HEAD:implementation/phase-8-runtime-executor
