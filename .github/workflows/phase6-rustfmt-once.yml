name: Phase 6 Rustfmt Once

on:
  push:
    branches: ["implementation/phase-6-managed-vault"]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-rustfmt-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-managed-vault
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Verify Phase 6 contract and formatting
        run: |
          python -W error tools/phase6_static_review.py
          cargo fmt --all -- --check

      - name: Commit formatter output and self-clean
        shell: bash
        run: |
          rm .github/workflows/phase6-rustfmt-once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add crates/neo-cli/src/main.rs crates/neo-vault .github/workflows/phase6-rustfmt-once.yml
          git diff --cached --check
          git commit -m "Phase 6: apply rustfmt [phase6-rustfmt-done]"
          git push origin HEAD:implementation/phase-6-managed-vault
