name: Phase 13 Consequence Helper

on:
  push:
    branches: [implementation/phase-13-debloat-assessment]

permissions:
  contents: write

jobs:
  close-finding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-13-debloat-assessment
          fetch-depth: 0

      - name: Configure repository writer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bind non-safe classes to consequence metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/neo-debloat/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          old = '''    #[error("duplicate preserved profile on {0}")]
              DuplicatePreservedProfile(String),
              #[error("only SAFE OPTIONAL items may be selected by default: {0}")]
          '''
          new = '''    #[error("duplicate preserved profile on {0}")]
              DuplicatePreservedProfile(String),
              #[error("non-safe debloat class requires side-effect/dependency notes: {0}")]
              MissingSideEffectNotes(String),
              #[error("only SAFE OPTIONAL items may be selected by default: {0}")]
          '''
          if text.count(old) != 1:
              raise SystemExit("error insertion marker not unique")
          text = text.replace(old, new, 1)

          old = '''        for side_effect in &self.side_effects {
                      require_text("debloat side effect", side_effect)?;
                  }

                  let mut profiles = BTreeSet::new();
          '''
          new = '''        for side_effect in &self.side_effects {
                      require_text("debloat side effect", side_effect)?;
                  }
                  if self.class != DebloatClass::SafeOptional && self.side_effects.is_empty() {
                      return Err(DebloatError::MissingSideEffectNotes(self.id.clone()));
                  }

                  let mut profiles = BTreeSet::new();
          '''
          if text.count(old) != 1:
              raise SystemExit("validation insertion marker not unique")
          text = text.replace(old, new, 1)

          replacements = [
              (
                  '''        item.class = DebloatClass::FeatureDependent;
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
                  '''        item.class = DebloatClass::FeatureDependent;
                          item.side_effects = vec!["synthetic feature consequence".to_string()];
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
              ),
              (
                  '''        item.class = DebloatClass::DependencySensitive;
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
                  '''        item.class = DebloatClass::DependencySensitive;
                          item.side_effects = vec!["synthetic dependency consequence".to_string()];
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
              ),
              (
                  '''        item.class = DebloatClass::ProtectedManualOnly;
                          item.risk = RiskLevel::High;
                          item.recommendation = RecommendationState::DoNotTouch;
                          item.restore = RestoreMethod::None;
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
                  '''        item.class = DebloatClass::ProtectedManualOnly;
                          item.risk = RiskLevel::High;
                          item.recommendation = RecommendationState::DoNotTouch;
                          item.restore = RestoreMethod::None;
                          item.side_effects = vec!["synthetic protected consequence".to_string()];
                          let catalogue = DebloatCatalogue::new(vec![item]).unwrap();
                  ''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unit fixture marker not unique: {text.count(old)}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Freeze formatting
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
          cargo fmt --all

      - name: Self-clean and commit correction
        run: |
          git rm .github/workflows/phase13-consequence-helper.yml
          git add -A
          git diff --cached --check
          git commit -m "Phase 13: require consequence metadata for non-safe classes"
          git push origin HEAD:implementation/phase-13-debloat-assessment
