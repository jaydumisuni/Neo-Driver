name: Phase 4 Validated Deserialization Once

on:
  push:
    branches: ["implementation/phase-4-transaction-v2"]

permissions:
  contents: write

jobs:
  validated-deser-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-deser-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-4-transaction-v2
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply validated-deserialization correction
        run: python tools/phase4_validated_deser_fix.py

      - name: Format and pre-prove correction
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-transaction --locked

      - name: Commit corrected source and remove one-shot helpers
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-transaction/src/plan.rs crates/neo-transaction/src/checkpoint.rs crates/neo-transaction/src/tests.rs tools/phase4_static_review.py
          git rm .github/workflows/phase4-deser-fix-once.yml tools/phase4_validated_deser_fix.py
          git commit -m "fix: validate Phase 4 root deserialization [phase4-deser-fix]"
          git push origin HEAD:implementation/phase-4-transaction-v2
