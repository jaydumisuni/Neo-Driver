name: Phase 5 Per Device Best Match Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  per-device-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-per-device]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply bounded per-device correction
        run: python tools/phase5_per_device_best_match.py
      - name: Prove platform-neutral contract
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven correction and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore
          git rm .github/workflows/phase5-per-device-once.yml tools/phase5_per_device_best_match.py
          git commit -m "fix: scope forward best-match install to authorized devices [phase5-per-device]"
          git push origin HEAD:staging-phase5-driver-install
