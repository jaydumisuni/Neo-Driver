name: Phase 10 status once

on:
  push:
    branches: ["docs/phase-10-merge-proof"]

permissions:
  contents: write

jobs:
  patch-status:
    if: ${{ !contains(github.event.head_commit.message, '[phase10-status-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical status
        run: python tools/phase10_status_patch_once.py

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "docs/IMPLEMENTATION_STATUS.md"
          grep -F 'Phase 10 merged through PR #17 as `15b62fcbab8d400fd5497b422243b85d7f3d5595`' docs/IMPLEMENTATION_STATUS.md
          grep -F 'Phases 1–10 are closed at their recorded repository boundaries.' docs/IMPLEMENTATION_STATUS.md

      - name: Commit patched status and self-clean
        shell: bash
        run: |
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git rm tools/phase10_status_patch_once.py .github/workflows/phase10-status-once.yml
          git add docs/IMPLEMENTATION_STATUS.md
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/phase10-status-once.yml\ndocs/IMPLEMENTATION_STATUS.md\ntools/phase10_status_patch_once.py'
          git commit -m 'Document Phase 10 merge proof [phase10-status-done]'
          git push origin HEAD:docs/phase-10-merge-proof
