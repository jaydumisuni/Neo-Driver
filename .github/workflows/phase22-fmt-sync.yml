name: Phase 22 rustfmt sync

on:
  push:
    branches: [implementation/phase22-driver-pnp-assessment]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase22-driver-pnp-assessment
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit canonical formatting when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-cli/src/repair_cli.rs crates/neo-driver-repair/src
          git commit -m "chore: apply Phase 22 rustfmt"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
