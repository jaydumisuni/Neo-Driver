name: Phase 14 gate diagnostic

on:
  push:
    branches: ["correction/phase-14-review-proof"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit Phase 14 gate output
        shell: bash
        run: |
          set +e
          output=$(python -W error tools/phase14_static_review.py 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            escaped=${output//'%'/'%25'}
            escaped=${escaped//$'\n'/'%0A'}
            escaped=${escaped//$'\r'/'%0D'}
            echo "::error title=Phase 14 exact gate output::$escaped"
            exit "$status"
          fi
