name: Phase 12 one-shot docs proof record

on:
  push:
    branches:
      - docs/phase-12-merge-proof

permissions:
  contents: write

jobs:
  record:
    if: github.event.head_commit.message != 'Record Phase 12 documentation-state proof'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase-12-merge-proof
          fetch-depth: 0

      - name: Apply proof record and self-clean
        run: |
          python tools/phase12_docs_proof_patch.py
          rm tools/phase12_docs_proof_patch.py
          rm .github/workflows/phase12_docs_proof_once.yml

      - name: Commit proof record
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Record Phase 12 documentation-state proof"
          git push origin HEAD:docs/phase-12-merge-proof
