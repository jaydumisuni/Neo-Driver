name: Phase 5 Core Fix Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  core-fix-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-core-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply bounded compiler fixes
        run: python tools/phase5_core_compile_fix.py
      - name: Format and prove core
        run: |
          cargo fmt --all
          cargo generate-lockfile
          python -W error tools/phase4_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven core and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/neo-driverstore tools/phase4_static_review.py
          git rm .github/workflows/phase5-core-proof.yml .github/workflows/phase5-core-fix-once.yml tools/phase5_core_compile_fix.py
          git commit -m "feat: prove Phase 5 driverstore core [phase5-core-fix]"
          git push origin HEAD:staging-phase5-driver-install
