name: Phase 17 Nested Validation Runner

on:
  push:
    branches: ["implementation/phase17-debloat-history-restore-readiness"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase17-debloat-history-restore-readiness
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply nested validation regression correction
        run: python tools/phase17_nested_validation_patch.py
      - name: Normalize Rust
        run: cargo fmt --all
      - name: Commit permanent correction and remove helper
        shell: bash
        run: |
          git rm .github/workflows/phase17-nested-validation-runner.yml tools/phase17_nested_validation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-debloat-history/src/tests.rs
          git commit -m "Phase 17: accept either nested or receipt validator rejection"
          git push origin HEAD:implementation/phase17-debloat-history-restore-readiness
