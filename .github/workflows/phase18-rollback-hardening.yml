name: Phase 18 Rollback Hardening Helper

on:
  push:
    branches: [implementation/phase18-debloat-restore-executor]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase18-debloat-restore-executor
          fetch-depth: 0
      - name: Apply exact rollback hardening
        env:
          PATCH_B64: 
        run: python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Install and format Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
          cargo fmt --all
      - name: Commit permanent hardening only
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/phase18-rollback-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/neo-debloat-restore-executor/src/engine.rs crates/neo-debloat-restore-executor/src/tests.rs tools/phase18_static_review.py docs/PHASE18_20_LANE_REVIEW.md docs/decisions/0018-PHASE18-DEBLOAT-RESTORE-EXECUTOR.md
          git commit -m 'Phase 18: recover baseline-present dependency cascades'
          git push origin HEAD:implementation/phase18-debloat-restore-executor
