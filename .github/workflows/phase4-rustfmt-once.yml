name: Phase 4 Rustfmt Once

on:
  push:
    branches: ["implementation/phase-4-transaction-v2"]

permissions:
  contents: write

jobs:
  rustfmt-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-4-transaction-v2
          fetch-depth: 0

      - name: Install stable Rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable

      - name: Apply rustfmt only
        run: cargo fmt --all

      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-cli/src/main.rs crates/neo-transaction/src
          git commit -m "style: apply Phase 4 rustfmt [phase4-rustfmt]"
          git push origin HEAD:implementation/phase-4-transaction-v2
