name: Phase 5 Baseline Package Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  baseline-package-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-baseline-package]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply exact baseline package fix
        run: python tools/phase5_baseline_package_fix.py
      - name: Prove rollback prerequisite
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven prerequisite and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore
          git rm .github/workflows/phase5-baseline-package-once.yml tools/phase5_baseline_package_fix.py
          git commit -m "fix: prove exact baseline driver package before authority [phase5-baseline-package]"
          git push origin HEAD:staging-phase5-driver-install
