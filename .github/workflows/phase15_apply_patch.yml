name: Phase 15 implementation patch

on:
  push:
    branches: ["implementation/phase15-debloat-transaction-readiness"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase15-debloat-transaction-readiness
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
      - name: Correct helper proof predicates
        shell: python
        run: |
          from pathlib import Path
          path = Path("tools/phase15_apply_patch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '("fingerprint continuity", "plan_fingerprint" in production and "transaction.fingerprint()" in production),',
              '("fingerprint continuity", "pub fn plan_fingerprint(&self) -> &str" in production and "self.checkpoint.plan_fingerprint()" in production and "TransactionCheckpoint::new(transaction.clone())?" in production),',
          )
          text = text.replace(
              'all(value not in production for value in ("RemovePackageAsync(", "RegisterPackageByFullNameAsync(", "DeprovisionPackageForAllUsersAsync(", "ProvisionPackageForAllUsersAsync(", "MCP_TWEAK", "rpc::", "plugin"))',
              'all(value not in production for value in (".RemovePackageAsync(", ".RegisterPackageByFullNameAsync(", ".DeprovisionPackageForAllUsersAsync(", ".ProvisionPackageForAllUsersAsync(", "MCP_TWEAK", "rpc::")) and "plugin" not in manifest.lower()',
          )
          path.write_text(text, encoding="utf-8")
      - name: Apply Phase 15 implementation
        run: python tools/phase15_apply_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit Phase 15 candidate
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Phase 15: add exact AppX transaction readiness"
          git push origin HEAD:implementation/phase15-debloat-transaction-readiness
