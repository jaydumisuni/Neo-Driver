name: Neo Driver CI

on:
  push:
    branches: ["main", "implementation/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.os }} proof
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Phase 1 twenty-lane static review
        shell: bash
        run: python -W error tools/phase1_static_review.py

      - name: Phase 2 twenty-lane static review
        shell: bash
        run: python -W error tools/phase2_static_review.py

      - name: Phase 3 twenty-lane static review
        shell: bash
        run: python -W error tools/phase3_static_review.py

      - name: Phase 4 twenty-lane static review
        shell: bash
        run: python -W error tools/phase4_static_review.py

      - name: Phase 5 twenty-lane static review
        shell: bash
        run: python -W error tools/phase5_static_review.py

      - name: Cargo lockfile proof
        shell: bash
        run: python -W error tools/lockfile_guard.py

      - name: Rust formatting proof
        shell: bash
        run: cargo fmt --all -- --check

      - name: Rust type/build proof
        shell: bash
        run: cargo check --workspace --all-targets --locked

      - name: Rust Clippy proof
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust unit proof
        shell: bash
        run: cargo test --workspace --all-targets --locked

      - name: Catalogue CLI fixture proof
        shell: bash
        run: cargo run -p neo-cli --locked -- catalogue validate fixtures/catalogue.sample.json --json

      - name: Matcher CLI fixture proof
        shell: bash
        run: cargo run -p neo-cli --locked -- match --inventory fixtures/device_inventory.sample.json --catalogue fixtures/catalogue.sample.json --architecture x64 --windows-build 26100 --device-instance-id "USB\\VID_1234&PID_5678\\NEO-FIXTURE" --json

      - name: Transaction plan CLI fixture proof
        shell: bash
        run: cargo run -p neo-cli --locked -- transaction validate-plan fixtures/transaction_plan.sample.json --json

      - name: Transaction checkpoint CLI fixture proof
        shell: bash
        run: cargo run -p neo-cli --locked -- transaction checkpoint-template fixtures/transaction_plan.sample.json --json
