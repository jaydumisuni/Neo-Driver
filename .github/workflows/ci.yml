name: Neo Driver CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engineering-proof:
    name: ${{ matrix.os }} proof
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Phase 1 twenty-lane static review
        run: python tools/phase1_static_review.py

      - name: Phase 2 twenty-lane static review
        run: python -W error tools/phase2_static_review.py

      - name: Phase 3 twenty-lane static review
        run: python -W error tools/phase3_static_review.py

      - name: Cargo lockfile proof
        run: |
          cargo generate-lockfile
          python tools/lockfile_guard.py

      - name: Rust formatting proof
        run: cargo fmt --all -- --check

      - name: Rust type/build proof
        run: cargo check --workspace --all-targets --locked

      - name: Rust Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust unit proof
        run: cargo test --workspace --all-targets --locked

      - name: Catalogue CLI fixture proof
        run: cargo run --locked -p neo-cli -- catalogue validate fixtures/catalogue/sample_driver_catalogue.json

      - name: Matcher CLI fixture proof
        run: cargo run --locked -p neo-cli -- match --device fixtures/match/device.json --catalogue fixtures/catalogue/sample_driver_catalogue.json --architecture x64 --build 26100
