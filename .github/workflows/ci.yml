name: Neo Driver CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engineering-proof:
    name: ${{ matrix.os }} proof
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Phase 1 twenty-lane static review
        run: python tools/phase1_static_review.py

      - name: Phase 2 twenty-lane static review
        run: python -W error tools/phase2_static_review.py

      - name: Phase 3 twenty-lane static review
        run: python -W error tools/phase3_static_review.py

      - name: Phase 4 twenty-lane static review
        run: python -W error tools/phase4_static_review.py

      - name: Phase 5 twenty-lane static review
        run: python -W error tools/phase5_static_review.py

      - name: Phase 6 twenty-lane static review
        run: python -W error tools/phase6_static_review.py

      - name: Phase 7 twenty-lane static review
        run: python -W error tools/phase7_static_review.py

      - name: Phase 8 twenty-lane static review
        run: python -W error tools/phase8_static_review.py

      - name: Phase 9 twenty-lane static review
        run: python -W error tools/phase9_static_review.py

      - name: Phase 10 twenty-lane static review
        run: python -W error tools/phase10_static_review.py

      - name: Phase 11 twenty-lane static review
        run: python -W error tools/phase11_static_review.py

      - name: Phase 12 twenty-lane static review
        run: python -W error tools/phase12_static_review.py

      - name: Phase 13 twenty-lane static review
        run: python -W error tools/phase13_static_review.py

      - name: Phase 14 twenty-lane static review
        run: python -W error tools/phase14_static_review.py

      - name: Cargo lockfile proof
        run: |
          cargo generate-lockfile
          python tools/lockfile_guard.py

      - name: Rust formatting proof
        run: cargo fmt --all -- --check

      - name: Rust type/build proof
        run: cargo check --workspace --all-targets --locked

      - name: Rust Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust unit proof
        run: cargo test --workspace --all-targets --locked

      - name: Phase 13 behavioral read-only proof
        run: cargo test --locked -p neo-debloat --test read_only

      - name: Phase 14 live Windows debloat inventory proof
        if: runner.os == 'Windows'
        run: cargo test --locked -p neo-debloat-probe --test live_read_only

      - name: Phase 10 live Windows state proof
        if: runner.os == 'Windows'
        run: cargo test --locked -p neo-cli --test state_live_read_only

      - name: Runtime System X-Ray proof
        if: runner.os == 'Windows'
        run: cargo run --locked -p neo-cli -- runtime-scan --json

      - name: Catalogue CLI fixture proof
        run: cargo run --locked -p neo-cli -- catalogue validate fixtures/catalogue/sample_driver_catalogue.json

      - name: Matcher CLI fixture proof
        run: cargo run --locked -p neo-cli -- match --device fixtures/match/device.json --catalogue fixtures/catalogue/sample_driver_catalogue.json --architecture x64 --build 26100

      - name: Runtime CLI fixture proof
        run: cargo run --locked -p neo-cli -- runtimes --evidence fixtures/runtime/runtime_inventory.json --catalogue fixtures/catalogue/sample_runtime_catalogue.json --policy fixtures/runtime/runtime_policy.json --profile fresh-windows

      - name: Gaming CLI fixture proof
        run: cargo run --locked -p neo-cli -- gaming --evidence fixtures/runtime/runtime_inventory.json --catalogue fixtures/catalogue/sample_runtime_catalogue.json --policy fixtures/runtime/runtime_policy.json

      - name: Vault source-map CLI fixture proof
        run: cargo run --locked -p neo-cli -- vault validate-sources config/driver-pack-sources.json

      - name: Runtime executor plan CLI fixture proof (Linux)
        if: runner.os == 'Linux'
        run: cargo run --locked -p neo-cli -- runtime-executor-validate-plan --plan fixtures/runtime-executor/plan-linux.json

      - name: Runtime executor plan CLI fixture proof (Windows)
        if: runner.os == 'Windows'
        run: cargo run --locked -p neo-cli -- runtime-executor-validate-plan --plan fixtures/runtime-executor/plan-windows.json

      - name: Debloat assessment fixture proof
        run: cargo run --locked -p neo-debloat --bin neo-debloat-assess -- fixtures/debloat/catalogue.json fixtures/debloat/evidence.json gaming appx.contoso.optional,appx.contoso.gaming,appx.contoso.system --json

      - name: Transaction plan CLI fixture proof
        run: cargo run --locked -p neo-cli -- transaction validate-plan fixtures/transaction/sample_transaction_plan.json

      - name: Transaction checkpoint CLI fixture proof
        run: |
          cargo run --locked --quiet -p neo-cli -- transaction checkpoint-template fixtures/transaction/sample_transaction_plan.json > target/phase4-checkpoint.json
          cargo run --locked -p neo-cli -- transaction validate-checkpoint target/phase4-checkpoint.json
