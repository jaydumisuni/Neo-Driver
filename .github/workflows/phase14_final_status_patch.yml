name: Phase 14 final status patch

on:
  push:
    branches: ["docs/phase-14-final-status"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-14-final-status
      - name: Apply canonical status patch
        run: python tools/phase14_final_status_patch.py
      - name: Verify status-only patch
        run: git diff --check
      - name: Commit canonical status
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A docs/IMPLEMENTATION_STATUS.md tools/phase14_final_status_patch.py .github/workflows/phase14_final_status_patch.yml
          git commit -m "Phase 14: record corrected canonical status"
          git push origin HEAD:docs/phase-14-final-status
