name: Phase 6 Cargo Lock Once

on:
  push:
    branches: ["implementation/phase-6-managed-vault"]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[phase6-lock-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-managed-vault
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Generate exact workspace lock
        run: cargo generate-lockfile

      - name: Verify expected Phase 6 graph
        shell: bash
        run: |
          grep -A12 'name = "neo-cli"' Cargo.lock | grep '"neo-vault"'
          grep -A10 'name = "neo-vault"' Cargo.lock | grep '"sha2"'
          python -W error tools/phase6_static_review.py

      - name: Commit generated lock and self-clean
        shell: bash
        run: |
          rm .github/workflows/phase6-lock-once.yml
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add Cargo.lock .github/workflows/phase6-lock-once.yml
          git commit -m "Phase 6: commit Cargo-generated lock [phase6-lock-done]"
          git push origin HEAD:implementation/phase-6-managed-vault
