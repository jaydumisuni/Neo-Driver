name: Phase 21 status mirror one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase21-status-mirror-sync.yml"
      - "docs/IMPLEMENTATION_STATUS.md"

permissions:
  contents: write

jobs:
  sync-status:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize Phase 21 mirror from frozen authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/IMPLEMENTATION_STATUS.md')
          decision_path = Path('docs/decisions/0021-PHASE21-REPAIR-WINDOWS-FEATURES.md')
          status = status_path.read_text(encoding='utf-8')
          decision = decision_path.read_text(encoding='utf-8')

          required = (
              '**Status:** FROZEN AND PROVEN',
              '068a2d9c8e671834e4583c6b5e09f4ba9d82b67e',
              'ecc3faa8eb84046975a520a33c46d8a5fa3690bf',
              '32071009541',
              '4c42e4822c1a811b5b999fafbfc00aedb0ac1a03',
              '2,465,792',
              'fc2889f28cf7b87e963a220d02d0d41398aec95428d073df60430341ced8dcc7',
              'Live destructive DISM/SFC/Windows-feature mutation remains deliberately unclaimed',
          )
          missing = [token for token in required if token not in decision]
          if missing:
              raise SystemExit(f'Phase 21 decision authority incomplete: {missing}')
          if '- **Phase 21:**' in status:
              raise SystemExit('Phase 21 status mirror already exists')
          if '- **Phase 20:** merged, corrected, and engineering-proven' not in status:
              raise SystemExit('Phase 20 status baseline missing')

          phase21_bullet = (
              '- **Phase 21:** merged, corrected, and fully proven — bounded Repair & Windows Features authority over fixed trusted-System32 DISM/SFC diagnosis/repair and six fixed optional-feature identities, with typed irreversible/reversible Phase 4 transactions, explicit confirmation/elevation, bounded servicing execution, exact post-state verification, machine-wide protected `Global\\` servicing serialization, durable caller-bound replay-resistant MCP/RPC prepare→confirm→apply/resume authority, and read-only CLI diagnosis. Exact merged source passed the complete Ubuntu/Windows Phase 1–21 pipeline plus real Windows read-only repair/feature probes; ATHENA Builder produced and smoke-proved the exact merged `neo.exe`. Live destructive DISM/SFC/Windows-feature mutation and the explicitly deferred broader repair domains remain unclaimed.'
          )
          state_anchor = '\n\nThe master plan remains frozen.'
          if status.count(state_anchor) != 1:
              raise SystemExit('Current-state insertion anchor is not unique')
          status = status.replace(state_anchor, '\n' + phase21_bullet + state_anchor, 1)

          phase21_baseline = (
              'Phase 21 final corrected implementation head `068a2d9c8e671834e4583c6b5e09f4ba9d82b67e` closed the independent-review findings for bounded servicing execution, rollback/error preservation, exact command authority, durable RPC resume continuity, semantic SFC integrity handling, machine-wide protected servicing serialization, and proof-gate enforcement. All actionable review threads were resolved before merge. Phase 21 merged through PR #43 as `ecc3faa8eb84046975a520a33c46d8a5fa3690bf`; merged-main run `32071009541` then passed the complete Ubuntu and Windows Phase 1–21 pipeline, including the 20-lane Phase 21 static review, locked workspace build, Clippy with warnings denied, full workspace units, dedicated `neo-repair` proof, trusted Windows-command contract, and live read-only `repair inspect --json` plus `repair features --json` probes. The reserved ATHENA physical gate used Builder `4c42e4822c1a811b5b999fafbfc00aedb0ac1a03` to build that exact merged Neo commit for `windows-exe`; Builder returned `TTG_RESULT` with `ok=true`, `state=complete`, and exit code `0`, producing `dist/windows/neo.exe` at 2,465,792 bytes with SHA-256 `fc2889f28cf7b87e963a220d02d0d41398aec95428d073df60430341ced8dcc7`. That exact artifact passed `--help` with exit code `0`. Documentation-only PR #44 then froze Decision 0021 on canonical `main` at `28fcefe63f11f3bf215ef21f17210be38f0ef780`. Live destructive DISM/SFC/Windows-feature mutation remains explicitly unclaimed.'
          )
          baseline_anchor = '\n\n## Phase 5 frozen implementation'
          if status.count(baseline_anchor) != 1:
              raise SystemExit('Proven-baseline insertion anchor is not unique')
          status = status.replace(baseline_anchor, '\n\n' + phase21_baseline + baseline_anchor, 1)

          if status.count('- **Phase 21:**') != 1:
              raise SystemExit('Phase 21 status mirror count mismatch')
          if status.count('Phase 21 final corrected implementation head') != 1:
              raise SystemExit('Phase 21 proven-baseline count mismatch')
          status_path.write_text(status, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only)" = "docs/IMPLEMENTATION_STATUS.md"
          grep -Fq -- '- **Phase 21:** merged, corrected, and fully proven' docs/IMPLEMENTATION_STATUS.md
          grep -Fq -- 'Phase 21 final corrected implementation head `068a2d9c8e671834e4583c6b5e09f4ba9d82b67e`' docs/IMPLEMENTATION_STATUS.md

      - name: Commit canonical mirror synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md
          git commit -m "docs: synchronize Phase 21 implementation status"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
