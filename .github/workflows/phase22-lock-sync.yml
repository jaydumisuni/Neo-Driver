name: Phase 22 lockfile sync

on:
  push:
    branches: [implementation/phase22-driver-pnp-assessment]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase22-driver-pnp-assessment
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate canonical workspace lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: synchronize Phase 22 Cargo lockfile"
          git push origin HEAD:implementation/phase22-driver-pnp-assessment
