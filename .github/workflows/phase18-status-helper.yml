name: Phase 18 Canonical Status Helper

on:
  push:
    branches: [docs/phase18-final-status]

permissions:
  contents: write

jobs:
  update-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase18-final-status
          fetch-depth: 0
      - name: Patch canonical Phase 18 status
        env:
          PATCH_B64: 
        run: python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Commit canonical status only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION_STATUS.md
          git commit -m 'Phase 18: record canonical implementation status'
          git push origin HEAD:docs/phase18-final-status
