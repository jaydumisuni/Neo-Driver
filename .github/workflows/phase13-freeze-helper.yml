name: Phase 13 Freeze Helper

on:
  push:
    branches: [implementation/phase-13-debloat-assessment]

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-13-debloat-assessment
          fetch-depth: 0

      - name: Configure repository writer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Close candidate-policy review finding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/neo-debloat/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          old_default = '''            if matches!(
                          self.recommendation,
                          RecommendationState::Conflict
                              | RecommendationState::Unsupported
                              | RecommendationState::DoNotTouch
                              | RecommendationState::Unknown
                      ) {
                          return Err(DebloatError::UnsafeRecommendationDefault(self.id.clone()));
                      }
          '''
          new_default = '''            if !recommendation_allows_removal(self.recommendation) {
                          return Err(DebloatError::UnsafeRecommendationDefault(self.id.clone()));
                      }
          '''
          if text.count(old_default) != 1:
              raise SystemExit("default recommendation gate marker not unique")
          text = text.replace(old_default, new_default, 1)

          old_enum = '''pub enum DebloatDisposition {
              RemovalCandidate,
              AlreadyAbsent,
              NeedsReview,
              BlockedByProfile,
              BlockedProtected,
          }
          '''
          new_enum = '''pub enum DebloatDisposition {
              RemovalCandidate,
              AlreadyAbsent,
              NeedsReview,
              BlockedByProfile,
              BlockedProtected,
              BlockedPolicy,
          }
          '''
          if text.count(old_enum) != 1:
              raise SystemExit("disposition enum marker not unique")
          text = text.replace(old_enum, new_enum, 1)

          old_policy = '''        let mut reasons = Vec::new();
                  let disposition = if observation.absent_for_scope(definition.scope) {
                      reasons.push("package is already absent for the requested scope".to_string());
                      DebloatDisposition::AlreadyAbsent
                  } else if definition.preserve_in_profiles.contains(&profile) {
                      reasons.push(format!("package is preserved by the {profile:?} profile"));
                      DebloatDisposition::BlockedByProfile
                  } else {
                      match definition.class {
                          DebloatClass::SafeOptional if definition.restore.available() => {
                              reasons.push(
                                  "SAFE OPTIONAL item with a declared restore path; removal may be reviewed"
                                      .to_string(),
                              );
                              DebloatDisposition::RemovalCandidate
                          }
                          DebloatClass::SafeOptional => {
                              reasons.push(
                                  "SAFE OPTIONAL item lacks a declared restore path and requires review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::FeatureDependent => {
                              reasons.push(
                                  "feature-dependent package requires side-effect/dependency review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::DependencySensitive => {
                              reasons.push(
                                  "dependency-sensitive package requires explicit dependency review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::ProtectedManualOnly => {
                              reasons.push(
                                  "protected/manual-only package cannot become normal debloat authority"
                                      .to_string(),
                              );
                              DebloatDisposition::BlockedProtected
                          }
                      }
                  };
          '''
          new_policy = '''        let mut reasons = Vec::new();
                  let disposition = if observation.absent_for_scope(definition.scope) {
                      reasons.push("package is already absent for the requested scope".to_string());
                      DebloatDisposition::AlreadyAbsent
                  } else if definition.class == DebloatClass::ProtectedManualOnly {
                      reasons.push(
                          "protected/manual-only package cannot become normal debloat authority"
                              .to_string(),
                      );
                      DebloatDisposition::BlockedProtected
                  } else if definition.preserve_in_profiles.contains(&profile) {
                      reasons.push(format!("package is preserved by the {profile:?} profile"));
                      DebloatDisposition::BlockedByProfile
                  } else if definition.verdict == EvidenceVerdict::Rejected
                      || matches!(
                          definition.recommendation,
                          RecommendationState::Conflict
                              | RecommendationState::Unsupported
                              | RecommendationState::DoNotTouch
                      )
                  {
                      reasons.push(
                          "catalogue policy blocks this package from normal debloat candidacy"
                              .to_string(),
                      );
                      DebloatDisposition::BlockedPolicy
                  } else if !candidate_policy_allows(definition) {
                      reasons.push(
                          "package does not satisfy Neo's low-risk certified removal-candidate policy"
                              .to_string(),
                      );
                      DebloatDisposition::NeedsReview
                  } else {
                      match definition.class {
                          DebloatClass::SafeOptional if definition.restore.available() => {
                              reasons.push(
                                  "SAFE OPTIONAL item with a declared restore path; removal may be reviewed"
                                      .to_string(),
                              );
                              DebloatDisposition::RemovalCandidate
                          }
                          DebloatClass::SafeOptional => {
                              reasons.push(
                                  "SAFE OPTIONAL item lacks a declared restore path and requires review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::FeatureDependent => {
                              reasons.push(
                                  "feature-dependent package requires side-effect/dependency review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::DependencySensitive => {
                              reasons.push(
                                  "dependency-sensitive package requires explicit dependency review"
                                      .to_string(),
                              );
                              DebloatDisposition::NeedsReview
                          }
                          DebloatClass::ProtectedManualOnly => DebloatDisposition::BlockedProtected,
                      }
                  };
          '''
          if text.count(old_policy) != 1:
              raise SystemExit("assessment policy marker not unique")
          text = text.replace(old_policy, new_policy, 1)

          marker = '''fn validate_id(value: &str) -> Result<(), DebloatError> {
          '''
          helpers = '''fn recommendation_allows_removal(value: RecommendationState) -> bool {
              matches!(
                  value,
                  RecommendationState::Recommended | RecommendationState::OptionalComponent
              )
          }

          fn candidate_policy_allows(definition: &DebloatDefinition) -> bool {
              definition.class == DebloatClass::SafeOptional
                  && definition.risk == RiskLevel::Low
                  && definition.verdict == EvidenceVerdict::Certified
                  && recommendation_allows_removal(definition.recommendation)
                  && definition.restore.available()
          }

          fn validate_id(value: &str) -> Result<(), DebloatError> {
          '''
          if text.count(marker) != 1:
              raise SystemExit("helper insertion marker not unique")
          text = text.replace(marker, helpers, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Freeze formatting and lockfile
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt --toolchain stable
          rustup default stable
          cargo fmt --all
          cargo generate-lockfile

      - name: Self-clean and commit frozen source
        run: |
          git rm .github/workflows/phase13-freeze-helper.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Phase 13: freeze candidate policy formatting and lockfile"
            git push origin HEAD:implementation/phase-13-debloat-assessment
          fi
