name: Phase 5 Windows Clippy Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  windows-clippy-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-windows-clippy]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply bounded Windows fixes
        shell: pwsh
        run: python tools/phase5_windows_clippy_fix.py
      - name: Prove Windows backend
        shell: pwsh
        run: |
          cargo fmt --all
          cargo check -p neo-driverstore --all-targets --locked
          cargo clippy -p neo-driverstore --all-targets --locked -- -D warnings
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven fixes and self-clean
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore/src/windows.rs
          git rm .github/workflows/phase5-windows-clippy-once.yml tools/phase5_windows_clippy_fix.py
          git commit -m "fix: close Phase 5 Windows Clippy gate [phase5-windows-clippy]"
          git push origin HEAD:staging-phase5-driver-install
