name: Phase 8 one-shot catalogue compatibility repair

on:
  push:
    branches: ["implementation/phase-8-runtime-executor"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-8-runtime-executor
          fetch-depth: 0
      - name: Apply exact compatibility edits
        shell: python
        run: |
          from pathlib import Path

          edits = [
              (
                  Path("crates/neo-match/src/tests.rs"),
                  "        driver_artifacts: vec![artifact],\n        dependencies: vec![],",
                  "        driver_artifacts: vec![artifact],\n        runtime_execution: None,\n        dependencies: vec![],",
              ),
              (
                  Path("crates/neo-runtime/src/lib.rs"),
                  "            driver_artifacts: vec![],\n            dependencies: vec![],",
                  "            driver_artifacts: vec![],\n            runtime_execution: None,\n            dependencies: vec![],",
              ),
          ]
          for path, old, new in edits:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one compatibility site, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format workspace
        run: cargo fmt --all
      - name: Prove exact compatibility surface
        run: |
          git diff --check
          git diff -- crates/neo-match/src/tests.rs crates/neo-runtime/src/lib.rs
      - name: Self-delete helper and commit
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git rm .github/workflows/phase8-compat-helper.yml
          git add crates/neo-match/src/tests.rs crates/neo-runtime/src/lib.rs crates/neo-catalogue/src/lib.rs
          git diff --cached --check
          git commit -m "Phase 8: preserve catalogue fixture compatibility"
          git push origin HEAD:implementation/phase-8-runtime-executor
