name: Phase 12 one-shot status marker correction

on:
  push:
    branches:
      - docs/phase-12-merge-proof

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message != 'Record Phase 12 canonical merge proof'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/phase-12-merge-proof
          fetch-depth: 0

      - name: Correct marker and apply status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/phase12_status_patch.py')
          text = p.read_text(encoding='utf-8')
          old = 'req_marker = "- `docs/decisions/0011-PHASE11-TWEAK-EXECUTOR.md`;"'
          new = 'req_marker = "- `docs/decisions/0011-PHASE11-TWEAK-EXECUTOR.md`."'
          if text.count(old) != 1:
              raise SystemExit('Decision 0011 patch marker did not match exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/phase12_status_patch.py
          rm tools/phase12_status_patch.py
          rm .github/workflows/phase12_status_once.yml
          rm .github/workflows/phase12_status_fix_once.yml

      - name: Commit canonical status
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Record Phase 12 canonical merge proof"
          git push origin HEAD:docs/phase-12-merge-proof
