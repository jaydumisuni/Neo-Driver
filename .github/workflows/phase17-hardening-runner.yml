name: Phase 17 Hardening Runner

on:
  push:
    branches: ["implementation/phase17-debloat-history-restore-readiness"]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase17-debloat-history-restore-readiness
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact Phase 17 hardening
        run: python tools/phase17_hardening_patch.py
      - name: Normalize Rust
        run: cargo fmt --all
      - name: Commit hardened permanent state
        shell: bash
        run: |
          git rm .github/workflows/phase17-hardening-runner.yml tools/phase17_hardening_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-debloat-history docs tools/phase17_static_review.py
          git commit -m "Phase 17: harden durable receipt and staged identity proof"
          git push origin HEAD:implementation/phase17-debloat-history-restore-readiness
