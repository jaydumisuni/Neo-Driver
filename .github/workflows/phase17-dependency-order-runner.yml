name: Phase 17 Dependency Order Correction

on:
  push:
    branches: ["implementation/phase17-debloat-history-restore-readiness"]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase17-debloat-history-restore-readiness
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply order-independent dependency conflict correction
        run: python tools/phase17_dependency_order_patch.py
      - name: Normalize Rust
        run: cargo fmt --all
      - name: Commit permanent correction and remove helpers
        shell: bash
        run: |
          git rm .github/workflows/phase17-dependency-order-runner.yml tools/phase17_dependency_order_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-debloat-history docs/PHASE17_20_LANE_REVIEW.md tools/phase17_static_review.py
          git commit -m "Phase 17: make dependency conflict detection order-independent"
          git push origin HEAD:implementation/phase17-debloat-history-restore-readiness
