name: Phase 6 Review Corrections Once

on:
  push:
    branches: ["implementation/phase-6-runtimes-gaming"]
    paths:
      - "tools/phase6_review_corrections.py"
      - ".github/workflows/phase6-review-corrections-once.yml"

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/phase-6-runtimes-gaming

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Apply bounded corrections
        run: python tools/phase6_review_corrections.py

      - name: Format
        run: cargo fmt --all

      - name: Phase 1-6 static proof
        shell: pwsh
        run: |
          python tools/phase1_static_review.py
          python -W error tools/phase2_static_review.py
          python -W error tools/phase3_static_review.py
          python -W error tools/phase4_static_review.py
          python -W error tools/phase5_static_review.py
          python -W error tools/phase6_static_review.py

      - name: Lock integrity
        shell: pwsh
        run: |
          cargo generate-lockfile
          python tools/lockfile_guard.py

      - name: Compiler proof
        run: cargo check --workspace --all-targets --locked

      - name: Clippy proof
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit proof
        run: cargo test --workspace --all-targets --locked

      - name: Live runtime scan proof
        run: cargo run --locked -p neo-cli -- runtime-scan --json

      - name: Runtime fixture proof
        run: cargo run --locked -p neo-cli -- runtimes --evidence fixtures/runtime/runtime_inventory.json --catalogue fixtures/catalogue/sample_runtime_catalogue.json --policy fixtures/runtime/runtime_policy.json --profile fresh-windows

      - name: Gaming fixture proof
        run: cargo run --locked -p neo-cli -- gaming --evidence fixtures/runtime/runtime_inventory.json --catalogue fixtures/catalogue/sample_runtime_catalogue.json --policy fixtures/runtime/runtime_policy.json

      - name: Self-clean and commit proven corrections
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/phase6_review_corrections.py .github/workflows/phase6-review-corrections-once.yml
          git add crates/neo-runtime/src/lib.rs crates/neo-runtime-probe/src/lib.rs tools/phase6_static_review.py
          git diff --cached --check
          git commit -m "fix: close Phase 6 fail-closed review findings"
          git push origin HEAD:implementation/phase-6-runtimes-gaming
