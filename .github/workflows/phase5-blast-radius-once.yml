name: Phase 5 Blast Radius Once

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: write

jobs:
  blast-radius-once:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-blast-radius]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Apply typed blast-radius failure
        run: python tools/phase5_typed_blast_radius_fix.py
      - name: Prove Phase 5 contract
        run: |
          cargo fmt --all
          python -W error tools/phase4_static_review.py
          python -W error tools/phase5_static_review.py
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-transaction --locked
          cargo test -p neo-driverstore --locked
          git diff --check
      - name: Commit proven correction and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/neo-driverstore/src/executor.rs
          git rm .github/workflows/phase5-blast-radius-once.yml tools/phase5_typed_blast_radius_fix.py
          git commit -m "fix: type Phase 5 blast-radius violations [phase5-blast-radius]"
          git push origin HEAD:staging-phase5-driver-install
