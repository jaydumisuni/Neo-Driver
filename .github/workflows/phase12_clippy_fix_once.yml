name: Phase 12 one-shot Clippy correction

on:
  push:
    branches:
      - implementation/phase-12-mcp-rpc-tweak-authority

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message != 'Remove needless RPC return after Clippy review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/phase-12-mcp-rpc-tweak-authority
          fetch-depth: 0

      - name: Apply bounded source correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/neo-tweak-executor/src/rpc.rs')
          text = path.read_text(encoding='utf-8')
          old = '            return Ok(execution_receipt(request, pending));'
          new = '            Ok(execution_receipt(request, pending))'
          if text.count(old) != 1:
              raise SystemExit('expected Phase 12 return site not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/phase12_clippy_fix_once.yml

      - name: Commit correction
        run: |
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add -A
          git commit -m "Remove needless RPC return after Clippy review"
          git push origin HEAD:implementation/phase-12-mcp-rpc-tweak-authority
