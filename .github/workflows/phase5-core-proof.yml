name: Phase 5 Driverstore Core Proof

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: read

jobs:
  core-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Generate dependency graph
        run: cargo generate-lockfile
      - name: Phase 4 regression gate
        run: python -W error tools/phase4_static_review.py
      - name: Compile workspace
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Driverstore regressions
        run: cargo test -p neo-driverstore --locked
      - name: Formatting proof
        run: cargo fmt --all -- --check
