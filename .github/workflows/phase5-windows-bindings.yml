name: Phase 5 Windows Binding Proof

on:
  push:
    branches: ["staging-phase5-driver-install"]

permissions:
  contents: read

jobs:
  windows-bindings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Lock integrity
        shell: pwsh
        run: cargo check -p neo-driverstore --all-targets --locked
      - name: Windows Clippy
        shell: pwsh
        run: cargo clippy -p neo-driverstore --all-targets --locked -- -D warnings

  ubuntu-core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-phase5-driver-install
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable
      - name: Phase 4 regression
        run: python -W error tools/phase4_static_review.py
      - name: Driverstore core
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test -p neo-driverstore --locked
