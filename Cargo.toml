[workspace]
resolver = "2"
members = [
    "crates/neo-core",
    "crates/neo-probe",
    "crates/neo-device",
    "crates/neo-catalogue",
    "crates/neo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["THETECHGUY DIGITAL SOLUTIONS"]
repository = "https://github.com/jaydumisuni/Neo-Driver"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
