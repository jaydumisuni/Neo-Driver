[workspace]
resolver = "2"
members = [
    "crates/neo-core",
    "crates/neo-probe",
    "crates/neo-device",
    "crates/neo-catalogue",
    "crates/neo-match",
    "crates/neo-transaction",
    "crates/neo-driverstore",
    "crates/neo-vault",
    "crates/neo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["THETECHGUY DIGITAL SOLUTIONS"]
repository = "https://github.com/jaydumisuni/Neo-Driver"

[workspace.dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }
